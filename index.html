<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useContext } = React;

/* ---------------------------------------------------------------
   Tokens
---------------------------------------------------------------- */
/* ClubCents palette. Navy = header, main buttons and headings; pitch green (the logo coin) = payments and credits;
   lime = highlights on dark backgrounds only (never text on white); deep orange = amounts owed; gray = voided entries and notes. */
const C = {
  bg: "#F4F6F3", surface: "#FFFFFF", ink: "#141B2D", inkSoft: "#4A5368",
  pitch: "#14213D", pitchDark: "#0B1428", pitchTint: "#E8ECF4",
  navy: "#14213D", navyTint: "#E8ECF4",
  debit: "#C2410C", debitTint: "#FCEDE4",
  credit: "#0E5A3A", creditTint: "#E6F1EA",
  line: "#DDE2DC", lineSoft: "#E7EAE5", amber: "#B98A1E",
  accent: "#D7F25C", coin: "#0E5A3A", voided: "#6B7280",
};


const DEBIT_CATEGORIES = ["Tournament Fee", "League Fee", "Coach Fee", "Adjustment", "Other"];
const CREDIT_CATEGORIES = ["Player Account Payment", "Adjustment", "Refund", "Other"];

const fmtMoney = (n) => (Number(n) || 0).toLocaleString("en-US", { style: "currency", currency: "USD" });
const todayStr = () => new Date().toISOString().slice(0, 10);
const thisMonthStr = () => new Date().toISOString().slice(0, 7);
const monthLabel = (m) => { const [y, mo] = m.split("-").map(Number); return new Date(y, mo - 1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" }); };
const slug = (s) => (s || "team").replace(/[^a-z0-9]+/gi, "-").replace(/^-+|-+$/g, "");
const hexToRgb = (hex) => { const n = parseInt(hex.replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

/* ---------------------------------------------------------------
   CSV / pasted-spreadsheet parsing for player import
---------------------------------------------------------------- */
function splitDelimited(line, delim) {
  const out = []; let cur = ""; let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else { inQuotes = false; } }
      else cur += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === delim) { out.push(cur); cur = ""; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out.map((s) => s.trim());
}
function parseDelimitedText(text) {
  const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n").filter((l) => l.trim().length > 0);
  if (lines.length === 0) return { headers: [], rows: [] };
  const commaCount = (lines[0].match(/,/g) || []).length;
  const tabCount = (lines[0].match(/\t/g) || []).length;
  const delim = tabCount > commaCount ? "\t" : ",";
  return { headers: splitDelimited(lines[0], delim), rows: lines.slice(1).map((l) => splitDelimited(l, delim)) };
}
const normalizeHeader = (h) => (h || "").toLowerCase().replace(/[^a-z0-9]/g, "");
const HEADER_ALIASES = {
  name: ["name", "playername", "player", "fullname"],
  parentName: ["parentname", "parent", "guardian", "parentguardian", "guardianname", "parent1", "parent1name", "guardian1", "guardian1name"],
  parentEmail: ["email", "parentemail", "guardianemail", "parent1email", "guardian1email"],
  parentName2: ["parentname2", "parent2", "guardian2", "secondparent", "parent2name", "guardian2name"],
  parentEmail2: ["email2", "parentemail2", "guardianemail2", "secondparentemail", "parent2email"],
  openingBalance: ["balance", "openingbalance", "opening", "startingbalance"],
  jersey: ["jersey", "jerseynumber", "jerseyno", "number", "no", "num", "uniformnumber"],
  notes: ["notes", "note", "comments", "comment"],
};
function mapHeaders(headers) {
  const norm = headers.map(normalizeHeader);
  const map = {};
  for (const field in HEADER_ALIASES) {
    const idx = norm.findIndex((h) => HEADER_ALIASES[field].includes(h));
    if (idx !== -1) map[field] = idx;
  }
  return map;
}
function buildImportPreview(text, existingNames) {
  const { headers, rows } = parseDelimitedText(text);
  if (headers.length === 0) return { error: null, items: [] };
  const map = mapHeaders(headers);
  if (map.name === undefined) return { error: 'Couldn\u2019t find a "Name" column. Make sure the first row has headers like Name, Parent Name, Parent Email, Opening Balance.', items: [] };
  const items = rows.map((r) => {
    const name = (r[map.name] || "").trim();
    const parentName = map.parentName !== undefined ? (r[map.parentName] || "").trim() : "";
    const parentEmail = map.parentEmail !== undefined ? (r[map.parentEmail] || "").trim() : "";
    const parentName2 = map.parentName2 !== undefined ? (r[map.parentName2] || "").trim() : "";
    const parentEmail2 = map.parentEmail2 !== undefined ? (r[map.parentEmail2] || "").trim() : "";
    const balRaw = map.openingBalance !== undefined ? (r[map.openingBalance] || "").trim() : "";
    const openingBalance = balRaw ? (parseFloat(balRaw.replace(/[^0-9.-]/g, "")) || 0) : 0;
    const notes = map.notes !== undefined ? (r[map.notes] || "").trim() : "";
    const jersey = map.jersey !== undefined ? (r[map.jersey] || "").trim().slice(0, 4) : "";
    return { name, jersey, parentName, parentEmail, parentName2, parentEmail2, openingBalance, notes, valid: !!name, duplicate: !!name && existingNames.has(name.toLowerCase()) };
  });
  return { error: null, items };
}
function downloadImportTemplate() {
  const csv = "Name,Jersey,Parent Name,Parent Email,Parent Name 2,Parent Email 2,Opening Balance,Notes\nJordan Smith,7,Alex Smith,alex@example.com,Jamie Smith,jamie@example.com,0,\n";
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "player-import-template.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function downloadBackupJSON(teamName, players, transactions, bank) {
  const backup = { format: "team-treasury-backup", version: 1, exportedAt: new Date().toISOString(), teamName, players, transactions, ...(bank ? { bankStart: bank.start || null, cashEntries: bank.cash || [], reconciliations: bank.recs || [] } : {}) };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${slug(teamName)}-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// A plain email to a player's parent(s): first email in To, second in Cc.
function buildParentEmailMailto(teamName, player) {
  const emails = [player.parentEmail, player.parentEmail2].map((e) => (e || "").trim()).filter(Boolean);
  if (!emails.length) return null;
  const subject = `${teamName} — ${player.name}`;
  let url = `mailto:${encodeURIComponent(emails[0])}?subject=${encodeURIComponent(subject)}`;
  if (emails[1] && emails[1].toLowerCase() !== emails[0].toLowerCase()) url += `&cc=${encodeURIComponent(emails[1])}`;
  return url;
}
function buildAccessCodeMailto(teamName, player) {
  const siteUrl = window.location.origin + window.location.pathname;
  const greetingName = player.parentName ? player.parentName.split(" ")[0] : "there";
  const subject = `${teamName} — Parent portal access for ${player.name}`;
  const emails = [player.parentEmail, player.parentEmail2].filter(Boolean).join(" or ");
  const link = siteUrl + (window.currentTeamId ? "?team=" + window.currentTeamId : "");
  const body = `Hi ${greetingName},\n\nYou can view ${player.name}'s team account balance and statements anytime at:\n\n${link}\n\nChoose "Parent Portal" and enter your email address (${emails}). We'll email you a one-tap sign in link. No password or code needed.\n\nThanks!`;
  let url = `mailto:${player.parentEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  if (player.parentEmail2) url += `&cc=${encodeURIComponent(player.parentEmail2)}`;
  return url;
}

/* ---------------------------------------------------------------
   Itemized charges: split a shared cost equally and explain the math
---------------------------------------------------------------- */
const defaultCoachLines = () => [{ label: "Hotel", amount: "", note: "" }, { label: "Mileage", amount: "", note: "" }, { label: "Food", amount: "", note: "" }];
// lines: [{label, amount, note}] (amount may be a string from an input); playerCount: how many players share the total.
// Works in whole cents so nothing drifts; each share is rounded to the nearest cent.
function computeSplit(lines, playerCount) {
  const clean = (lines || [])
    .map((l) => ({ label: String(l.label || "").trim(), cents: Math.round((parseFloat(l.amount) || 0) * 100), note: String(l.note || "").trim() }))
    .filter((l) => l.cents > 0);
  const totalCents = clean.reduce((sum, l) => sum + l.cents, 0);
  const n = Math.max(0, Math.floor(Number(playerCount) || 0));
  const shareCents = n > 0 ? Math.round(totalCents / n) : 0;
  return {
    lines: clean.map((l) => ({ label: l.label || "Item", amount: l.cents / 100, note: l.note })),
    total: totalCents / 100, players: n, share: shareCents / 100, exact: n > 0 && shareCents * n === totalCents,
  };
}
function breakdownParts(b) {
  const itemsText = b.lines.map((l) => `${l.label} ${fmtMoney(l.amount)}${l.note ? " (" + l.note + ")" : ""}`).join(" + ");
  const summaryText = `${fmtMoney(b.total)} total ÷ ${b.players} ${b.players === 1 ? "player" : "players"} = ${fmtMoney(b.share)} each${b.exact ? "" : " (rounded to the nearest cent)"}`;
  return { itemsText, summaryText };
}
const hasBreakdown = (t) => !!(t && t.breakdown && t.breakdown.lines && t.breakdown.lines.length);
const breakdownText = (b) => { const p = breakdownParts(b); return `${p.itemsText} = ${p.summaryText}`; };
// Description text for PDFs: the note you typed, plus the calculation underneath when the charge is itemized.
const pdfDescription = (t) => { const d = t.description || ""; const b = hasBreakdown(t) ? breakdownText(t.breakdown) : ""; return d && b ? d + "\n" + b : (d || b || "—"); };

function buildStatementMailto(teamName, player, month, stats) {
  const greetingName = player.parentName ? player.parentName.split(" ")[0] : "there";
  const lines = stats.rows.length
    ? stats.rows.map((t) => `  ${t.date} — ${t.category}${t.description ? " (" + t.description + ")" : ""}: ${t.direction === "debit" ? "+" : "-"}${fmtMoney(t.amount)}${hasBreakdown(t) ? "\n      " + breakdownText(t.breakdown) : ""}`).join("\n")
    : "  No activity this month.";
  const subject = `${teamName} — ${player.name}'s Statement — ${monthLabel(month)}`;
  const body = `Hi ${greetingName},\n\nHere is ${player.name}'s account statement for ${monthLabel(month)} from ${teamName}.\n\nBeginning balance: ${fmtMoney(stats.beginning)}\nDebits (charges): ${fmtMoney(stats.debits)}\nCredits (paid): ${fmtMoney(stats.credits)}\nEnding balance: ${fmtMoney(Math.abs(stats.ending))}${stats.ending > 0.004 ? " CR" : ""}\n\nTransactions this month:\n${lines}\n\nIf you have any questions, please don't hesitate to reach out.\n\nThanks,\n${teamName}`;
  let url = `mailto:${player.parentEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  if (player.parentEmail2) url += `&cc=${encodeURIComponent(player.parentEmail2)}`;
  return url;
}

async function commitInChunks(snapshot) {
  const docs = snapshot.docs;
  for (let i = 0; i < docs.length; i += 400) {
    const batch = window.db.batch();
    docs.slice(i, i + 400).forEach((d) => batch.delete(d.ref));
    await batch.commit();
  }
}

/* ---------------------------------------------------------------
   Small building blocks
---------------------------------------------------------------- */
function Spinner({ size = 15, color }) {
  return <span className="inline-block animate-spin rounded-full border-2" style={{ width: size, height: size, borderColor: color || C.pitch, borderTopColor: "transparent" }} />;
}
function Monogram({ letter, bg }) {
  return <span className="inline-flex items-center justify-center rounded-xl font-black text-white" style={{ width: 40, height: 40, background: bg || C.pitch }}>{letter}</span>;
}
// A player's jersey number, or null when none is set
const jerseyOf = (p) => (p && p.jersey != null && String(p.jersey).trim() !== "" ? String(p.jersey).trim() : null);
function JerseyBadge({ n, space }) {
  if (n == null || n === "") return space ? <span aria-hidden="true" className="inline-block shrink-0" style={{ width: 28, height: 28 }} /> : null;
  return <span className="inline-flex items-center justify-center rounded-full text-xs font-black shrink-0" style={{ width: 28, height: 28, background: C.pitchTint, color: C.pitchDark, fontVariantNumeric: "tabular-nums" }}>{n}</span>;
}
function MoneyText({ value, className = "", size = "base" }) {
  const owed = value < -0.004, hasCredit = value > 0.004;
  const color = owed ? C.debit : hasCredit ? C.credit : C.inkSoft;
  const sizeClass = size === "lg" ? "text-2xl" : size === "sm" ? "text-sm" : "text-base";

/* ---------------------------------------------------------------
   Balance math
---------------------------------------------------------------- */
function buildLedger(players, transactions) {
  const byPlayer = {};
  for (const p of players) byPlayer[p.id] = [];
  for (const t of transactions) if (byPlayer[t.playerId]) byPlayer[t.playerId].push(t);
  for (const id in byPlayer) byPlayer[id].sort((a, b) => a.date.localeCompare(b.date));

  const currentBalance = (playerId) => {
    const p = players.find((pl) => pl.id === playerId);
    if (!p) return 0;
    let bal = Number(p.openingBalance) || 0;
    for (const t of byPlayer[playerId] || []) bal += t.direction === "credit" ? t.amount : -t.amount;
    return bal;
  };

  const monthStats = (playerId, monthStr) => {
    const p = players.find((pl) => pl.id === playerId);
    let beginning = Number(p?.openingBalance) || 0;
    const inMonth = [];
    for (const t of byPlayer[playerId] || []) {
      const tMonth = t.date.slice(0, 7);
      if (tMonth < monthStr) beginning += t.direction === "credit" ? t.amount : -t.amount;
      else if (tMonth === monthStr) inMonth.push(t);
    }
    let debits = 0, credits = 0, running = beginning;
    const rows = inMonth.map((t) => {
      running += t.direction === "credit" ? t.amount : -t.amount;
      if (t.direction === "debit") debits += t.amount; else credits += t.amount;
      return { ...t, running };
    });
    return { beginning, debits, credits, ending: beginning + credits - debits, rows };
  };
  const seasonStats = (playerId) => {
    const p = players.find((pl) => pl.id === playerId);
    const beginning = Number(p?.openingBalance) || 0;
    let debits = 0, credits = 0, running = beginning;
    const rows = (byPlayer[playerId] || []).map((t) => {
      running += t.direction === "credit" ? t.amount : -t.amount;
      if (t.direction === "debit") debits += t.amount; else credits += t.amount;
      return { ...t, running };
    });
    return { beginning, debits, credits, ending: beginning + credits - debits, rows };
  };
  return { currentBalance, monthStats, seasonStats };
}
function useLedger(players, transactions) {
  return useMemo(() => buildLedger(players, transactions), [players, transactions]);
}

// Works out which transactions a "Show" filter selects, plus the total, for the full-season statement.
// A filter value is "all", "debit|*" (all charges), "credit|*" (all payments), or "debit|<category>" / "credit|<category>".
function deriveStatementFilter(rows, filter) {
  const cats = (dir) => [...new Set(rows.filter((t) => t.direction === dir).map((t) => t.category))].sort();
  const debitCats = cats("debit"), creditCats = cats("credit");
  const known = filter === "all" || filter === "debit|*" || filter === "credit|*" ||
    (filter.indexOf("debit|") === 0 && debitCats.includes(filter.slice(6))) ||
    (filter.indexOf("credit|") === 0 && creditCats.includes(filter.slice(7)));
  const active = known ? filter : "all";
  if (active === "all") return { active, debitCats, creditCats, rows, info: null };
  const sep = active.indexOf("|");
  const dir = active.slice(0, sep), cat = active.slice(sep + 1);
  const visible = rows.filter((t) => t.direction === dir && (cat === "*" || t.category === cat));
  const label = cat === "*" ? (dir === "debit" ? "All Charges" : "All Payments") : `${cat} (${dir === "debit" ? "charge" : "payment"})`;
  return { active, debitCats, creditCats, rows: visible, info: { label, direction: dir, rows: visible, total: visible.reduce((sum, t) => sum + t.amount, 0) } };
}

        </div>
      )}

        ) : split.total > 0 ? "Tick the players below to see each share." : "Enter at least one cost line."}
      </p>
    </div>
  );
}

function RosterTab({ teamName, players, ledger, addPlayer, addPlayersBulk, updatePlayer, deletePlayer, onOpenStatement }) {
  const [showAdd, setShowAdd] = useState(false); const [query, setQuery] = useState(""); const [copiedId, setCopiedId] = useState(null);
  const [form, setForm] = useState({ name: "", jersey: "", parentName: "", parentEmail: "", parentName2: "", parentEmail2: "", openingBalance: "0", notes: "" });
  const resetForm = () => setForm({ name: "", jersey: "", parentName: "", parentEmail: "", parentName2: "", parentEmail2: "", openingBalance: "0", notes: "" });
  const submitAdd = async () => {
    if (!form.name.trim()) return;
    await addPlayer({ name: form.name.trim(), jersey: (form.jersey || "").trim(), parentName: form.parentName.trim(), parentEmail: form.parentEmail.trim(), parentName2: form.parentName2.trim(), parentEmail2: form.parentEmail2.trim(), openingBalance: parseFloat(form.openingBalance) || 0, active: true, notes: form.notes.trim() });
    resetForm(); setShowAdd(false);
  };
  const filtered = players.filter((p) => p.name.toLowerCase().includes(query.toLowerCase()));

  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState(null);
  const startEdit = (p) => {
    setShowAdd(false); setShowImport(false);
    setEditingId(p.id);
    setTimeout(() => { const el = document.getElementById("edit-player-form"); if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); const f = el.querySelector("input"); if (f) f.focus({ preventScroll: true }); } }, 60);
    setEditForm({ name: p.name || "", jersey: p.jersey != null ? String(p.jersey) : "", parentName: p.parentName || "", parentEmail: p.parentEmail || "", parentName2: p.parentName2 || "", parentEmail2: p.parentEmail2 || "", notes: p.notes || "" });
  };
  const saveEdit = async () => {
    if (!editForm.name.trim()) return;
    await updatePlayer(editingId, { name: editForm.name.trim(), jersey: (editForm.jersey || "").trim(), parentName: editForm.parentName.trim(), parentEmail: editForm.parentEmail.trim(), parentName2: editForm.parentName2.trim(), parentEmail2: editForm.parentEmail2.trim(), notes: editForm.notes.trim() });
    setEditingId(null); setEditForm(null);
  };

  const [showImport, setShowImport] = useState(false);
  const [importText, setImportText] = useState("");
  const [importBusy, setImportBusy] = useState(false);
  const [importMsg, setImportMsg] = useState("");
  const existingNames = useMemo(() => new Set(players.map((p) => p.name.trim().toLowerCase())), [players]);
  const importPreview = useMemo(() => (importText.trim() ? buildImportPreview(importText, existingNames) : null), [importText, existingNames]);
  const validItems = importPreview && !importPreview.error ? importPreview.items.filter((it) => it.valid) : [];
  const invalidCount = importPreview && !importPreview.error ? importPreview.items.length - validItems.length : 0;
  const duplicateCount = validItems.filter((it) => it.duplicate).length;

  const onFileChosen = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setImportText(String(reader.result || ""));
    reader.readAsText(file);
    e.target.value = "";
  };
  const confirmImport = async () => {
    if (validItems.length === 0) return;
    setImportBusy(true); setImportMsg("");
    try {
      await addPlayersBulk(validItems.map((it) => ({ name: it.name, jersey: it.jersey || "", parentName: it.parentName, parentEmail: it.parentEmail, parentName2: it.parentName2, parentEmail2: it.parentEmail2, openingBalance: it.openingBalance, active: true, notes: it.notes })));
      setImportMsg(`Imported ${validItems.length} player${validItems.length === 1 ? "" : "s"}.`);
      setImportText("");
    } catch (e) { setImportMsg("Something went wrong — please try again."); }
    setImportBusy(false);
  };

  return (
    <div>
      <div className="flex items-center justify-between gap-3 mb-4 flex-wrap">
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="🔍 Search players…" style={inputStyle} className="rounded-lg px-3 py-2 text-sm outline-none w-56" />
        <div className="flex items-center gap-2">
          <ExportButton onExport={() => exportRosterPDF(teamName, players, ledger)} />
          <Button variant="ghost" onClick={() => { setShowImport((s) => !s); setShowAdd(false); setEditingId(null); }}>⬆ Import</Button>
          <Button onClick={() => { setShowAdd((s) => !s); setShowImport(false); setEditingId(null); }}>+ Add Player</Button>
        </div>
      </div>
      {showImport && (
        <div className="rounded-2xl p-5 mb-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <p className="font-black mb-1" style={{ color: C.ink }}>Import Players</p>
          <p className="text-sm mb-3" style={{ color: C.inkSoft }}>Paste rows straight from a spreadsheet, or upload a CSV file. Include a header row — <b>Name</b> is required; Jersey, Parent Name, Parent Email, Parent Name 2, Parent Email 2, Opening Balance, and Notes are optional.</p>
          <div className="flex items-center gap-3 mb-3 flex-wrap">
            <label className="inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold cursor-pointer" style={{ border: `1px solid ${C.line}`, color: C.ink }}>
              📄 Choose CSV File<input type="file" accept=".csv,text/csv" className="hidden" onChange={onFileChosen} />
            </label>
            <button onClick={downloadImportTemplate} className="text-sm font-semibold" style={{ color: C.pitchDark }}>Download Template</button>
          </div>
          <textarea value={importText} onChange={(e) => setImportText(e.target.value)} rows={5} placeholder={"Name, Parent Name, Parent Email, Opening Balance, Notes\nJordan Smith, Alex Smith, alex@example.com, 0,"} style={inputStyle} className="w-full rounded-lg px-3 py-2 text-sm outline-none font-mono" />

          {importPreview && importPreview.error && <p className="text-xs font-semibold mt-2" style={{ color: C.debit }}>{importPreview.error}</p>}

          {importPreview && !importPreview.error && importPreview.items.length > 0 && (<>
            <div className="flex items-center gap-4 mt-3 mb-2 flex-wrap text-xs font-semibold">
              <span style={{ color: C.credit }}>{validItems.length} ready to import</span>
              {invalidCount > 0 && <span style={{ color: C.debit }}>{invalidCount} skipped (missing name)</span>}
              {duplicateCount > 0 && <span style={{ color: C.amber }}>{duplicateCount} possible duplicate{duplicateCount === 1 ? "" : "s"} of existing players</span>}
            </div>
            <div className="rounded-xl mb-3" style={{ border: `1px solid ${C.line}`, maxHeight: 260, overflowY: "auto", overflowX: "auto", WebkitOverflowScrolling: "touch" }}>
              <table className="w-full text-sm" style={{ minWidth: 560 }}>
                <thead><tr className="text-left" style={{ background: C.lineSoft, color: C.inkSoft }}><th className="font-semibold px-3 py-2">Name</th><th className="font-semibold px-3 py-2">Parent(s)</th><th className="font-semibold px-3 py-2">Email(s)</th><th className="font-semibold px-3 py-2 text-right">Opening</th><th className="font-semibold px-3 py-2">Status</th></tr></thead>
                <tbody>{importPreview.items.map((it, i) => (
                  <tr key={i} className="border-t" style={{ borderColor: C.lineSoft, opacity: it.valid ? 1 : 0.5 }}>
                    <td className="px-3 py-2 font-semibold" style={{ color: C.ink }}>{it.name || "—"}</td>
                    <td className="px-3 py-2" style={{ color: C.inkSoft }}>{[it.parentName, it.parentName2].filter(Boolean).join(", ") || "—"}</td>
                    <td className="px-3 py-2" style={{ color: C.inkSoft }}>{[it.parentEmail, it.parentEmail2].filter(Boolean).join(", ") || "—"}</td>
                    <td className="px-3 py-2 text-right" style={{ color: C.inkSoft, fontVariantNumeric: "tabular-nums" }}>{fmtMoney(it.openingBalance)}</td>
                    <td className="px-3 py-2 text-xs font-semibold" style={{ color: !it.valid ? C.debit : it.duplicate ? C.amber : C.credit }}>{!it.valid ? "Missing Name" : it.duplicate ? "Possible Duplicate" : "Ready"}</td>
                  </tr>
                ))}</tbody>
              </table>
            </div>
          </>)}

          <div className="flex items-center gap-3 flex-wrap">
            <Button disabled={importBusy || validItems.length === 0} onClick={confirmImport}>{importBusy ? <Spinner size={14} color="#fff" /> : "⬆"} Import {validItems.length || ""} Player{validItems.length === 1 ? "" : "s"}</Button>
            <Button variant="ghost" onClick={() => { setShowImport(false); setImportText(""); setImportMsg(""); }}>Cancel</Button>
            {importMsg && <p className="text-sm font-semibold" style={{ color: C.pitchDark }}>{importMsg}</p>}
          </div>
        </div>
      )}
      {showAdd && (
        <div className="rounded-2xl p-5 mb-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <p className="font-black mb-3" style={{ color: C.ink }}>New Player</p>
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label="Player Name"><TextInput value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Full name" /></Field>
            <Field label="Jersey Number (Optional)"><TextInput value={form.jersey} maxLength={4} onChange={(e) => setForm({ ...form, jersey: e.target.value })} placeholder="e.g. 7" /></Field>
            <Field label="Parent/Guardian Name"><TextInput value={form.parentName} onChange={(e) => setForm({ ...form, parentName: e.target.value })} /></Field>
            <Field label="Parent Email"><TextInput type="email" value={form.parentEmail} onChange={(e) => setForm({ ...form, parentEmail: e.target.value })} /></Field>
            <Field label="Second Parent/Guardian Name (Optional)"><TextInput value={form.parentName2} onChange={(e) => setForm({ ...form, parentName2: e.target.value })} /></Field>
            <Field label="Second Parent Email (Optional)"><TextInput type="email" value={form.parentEmail2} onChange={(e) => setForm({ ...form, parentEmail2: e.target.value })} /></Field>
            <Field label="Opening Balance" hint="Positive = credit on file (prepaid), negative = amount owed"><TextInput type="number" step="0.01" value={form.openingBalance} onChange={(e) => setForm({ ...form, openingBalance: e.target.value })} /></Field>
            <div><Field label="Notes" hint="e.g. payment plan details, fee waivers"><TextInput value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} /></Field></div>
          </div>
          <div className="flex gap-2 mt-4"><Button onClick={submitAdd}>✓ Add Player</Button><Button variant="ghost" onClick={() => { setShowAdd(false); resetForm(); }}>Cancel</Button></div>
        </div>
      )}
      {editingId && editForm && (
        <div id="edit-player-form" className="rounded-2xl p-5 mb-5" style={{ scrollMarginTop: 16,  background: C.surface, border: `1px solid ${C.pitch}` }}>
          <p className="font-black mb-3" style={{ color: C.ink }}>Edit Player</p>
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label="Player Name"><TextInput value={editForm.name} onChange={(e) => setEditForm({ ...editForm, name: e.target.value })} /></Field>
            <Field label="Jersey Number (Optional)"><TextInput value={editForm.jersey} maxLength={4} onChange={(e) => setEditForm({ ...editForm, jersey: e.target.value })} placeholder="e.g. 7" /></Field>
            <Field label="Parent/Guardian Name"><TextInput value={editForm.parentName} onChange={(e) => setEditForm({ ...editForm, parentName: e.target.value })} /></Field>
            <Field label="Parent Email"><TextInput type="email" value={editForm.parentEmail} onChange={(e) => setEditForm({ ...editForm, parentEmail: e.target.value })} /></Field>
            <Field label="Second Parent/Guardian Name (Optional)"><TextInput value={editForm.parentName2} onChange={(e) => setEditForm({ ...editForm, parentName2: e.target.value })} /></Field>
            <Field label="Second Parent Email (Optional)"><TextInput type="email" value={editForm.parentEmail2} onChange={(e) => setEditForm({ ...editForm, parentEmail2: e.target.value })} /></Field>
            <div className="sm:col-span-2"><Field label="Notes"><TextInput value={editForm.notes} onChange={(e) => setEditForm({ ...editForm, notes: e.target.value })} /></Field></div>
          </div>
          <div className="flex gap-2 mt-4"><Button onClick={saveEdit}>✓ Save Changes</Button><Button variant="ghost" onClick={() => { setEditingId(null); setEditForm(null); }}>Cancel</Button></div>
        </div>
      )}
      {players.length === 0 ? <EmptyState title="No Players Yet" body="Add your first player to start tracking fees and payments." /> : (
        <div className="rounded-2xl overflow-hidden" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="table-scroll">
          <table className="w-full text-sm">
            <thead><tr className="text-left" style={{ background: C.lineSoft, color: C.inkSoft }}><th className="font-semibold px-4 py-3">Player</th><th className="font-semibold px-4 py-3">Parent Contact</th><th className="font-semibold px-4 py-3">Parent Portal</th><th className="font-semibold px-4 py-3 text-right">Balance</th><th className="font-semibold px-4 py-3 text-right">Actions</th></tr></thead>
            <tbody>{filtered.map((p, i) => (
              <tr key={p.id} className="border-t" style={{ borderColor: C.lineSoft, opacity: p.active ? 1 : 0.5 }}>
                <td className="px-4 py-3"><div className="flex items-center gap-2.5"><JerseyBadge n={jerseyOf(p)} space={players.some((x) => jerseyOf(x))} /><div><button onClick={() => onOpenStatement(p.id)} className="font-bold hover:underline text-left" style={{ color: C.ink }}>{p.name}</button>{!p.active && <p className="text-xs" style={{ color: C.inkSoft }}>Inactive</p>}</div></div></td>
                <td className="px-4 py-3" style={{ color: C.inkSoft }}>
                  <div>{p.parentName || "—"}</div>{p.parentEmail && <div className="text-xs">{p.parentEmail}</div>}
                  {(p.parentName2 || p.parentEmail2) && <div className="mt-1">{p.parentName2 || "—"}</div>}{p.parentEmail2 && <div className="text-xs">{p.parentEmail2}</div>}
                </td>
                <td className="px-4 py-3">{p.parentEmail || p.parentEmail2 ? (
                  <a href={buildAccessCodeMailto(teamName, p)} title="Email the parent(s) how to sign in" className="text-xs font-semibold" style={{ color: C.pitchDark, textDecoration: "none" }}>✉ Send Invite</a>
                ) : (
                  <span className="text-xs" title="Parents sign in with the email on file. Add one to give them access." style={{ color: C.debit }}>⚠ No Email</span>
                )}</td>
                <td className="px-4 py-3 text-right"><MoneyText value={ledger.currentBalance(p.id)} /></td>
                <td className="px-4 py-3"><div className="flex items-center justify-end gap-3">
                  {buildParentEmailMailto(teamName, p) ? <a href={buildParentEmailMailto(teamName, p)} title={"Email " + [p.parentEmail, p.parentEmail2].filter(Boolean).join(" and ")} className="text-xs font-semibold" style={{ color: C.pitchDark, textDecoration: "none", whiteSpace: "nowrap" }}>✉ Email</a> : <span className="text-xs" title="No parent email on file" style={{ color: C.line, whiteSpace: "nowrap" }}>✉ Email</span>}
                  <button onClick={() => startEdit(p)} className="text-xs font-semibold" style={{ color: C.pitchDark }}>Edit</button>
                  <button onClick={() => updatePlayer(p.id, { active: !p.active })} className="text-xs font-semibold" style={{ color: C.pitchDark }}>{p.active ? "Deactivate" : "Reactivate"}</button>
                  <button onClick={() => { if (confirm("Delete this player? Players with any transaction history can't be deleted. Deactivate them instead.")) deletePlayer(p.id); }} title="Delete Player" style={{ color: C.debit }}>🗑</button>
                </div></td>
              </tr>
            ))}</tbody>
          </table>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   Admin: Transactions tab
---------------------------------------------------------------- */
function TransactionsTab({ teamName, players, transactions, addTxn, addBulkTxn, deleteTxn, updateTxn, presetPlayerId }) {
  const [mode, setMode] = useState("single");
  const [form, setForm] = useState({ playerId: presetPlayerId || (players[0]?.id ?? ""), date: todayStr(), direction: "debit", category: DEBIT_CATEGORIES[0], amount: "", description: "" });
  const [bulkForm, setBulkForm] = useState({ date: todayStr(), direction: "debit", category: DEBIT_CATEGORIES[0], amount: "", description: "", itemize: false, lines: defaultCoachLines() });
  const [selectedIds, setSelectedIds] = useState(() => new Set());
  const [bulkQuery, setBulkQuery] = useState("");
  const [bulkBusy, setBulkBusy] = useState(false);
  const [bulkMsg, setBulkMsg] = useState("");
  const [filterPlayer, setFilterPlayer] = useState("all"); const [filterMonth, setFilterMonth] = useState("");
  useEffect(() => { if (presetPlayerId) setForm((f) => ({ ...f, playerId: presetPlayerId })); }, [presetPlayerId]);
  const cats = form.direction === "debit" ? DEBIT_CATEGORIES : CREDIT_CATEGORIES;
  const bulkCats = bulkForm.direction === "debit" ? DEBIT_CATEGORIES : CREDIT_CATEGORIES;
  const bulkItemized = bulkForm.itemize && bulkForm.direction === "debit";
  const bulkSplit = computeSplit(bulkForm.lines, selectedIds.size);
  // Choosing "Coach Fee" turns on the itemized split (Hotel / Mileage / Food) automatically.
  const changeBulkCategory = (cat) => setBulkForm((f) => {
    const isCoach = cat === "Coach Fee" && f.direction === "debit";
    const hasEntered = f.lines.some((l) => String(l.amount).trim() !== "");
    return { ...f, category: cat, itemize: isCoach, lines: isCoach && !hasEntered ? defaultCoachLines() : f.lines };
  });
  const numberOf = useMemo(() => players.reduce((acc, p, idx) => (acc[p.id] = idx + 1, acc), {}), [players]);

  const submit = async () => {
    if (!form.playerId || !form.amount || Number(form.amount) <= 0) return;
    await addTxn({ playerId: form.playerId, date: form.date, direction: form.direction, category: form.category, amount: parseFloat(form.amount), description: form.description.trim(), createdAt: Date.now(), ...(form.direction === "credit" ? { via: form.via || defaultVia(form.category) } : {}) });
    setForm({ ...form, amount: "", description: "", via: undefined });
  };

  const [editingTxnId, setEditingTxnId] = useState(null);
  const [editTxnForm, setEditTxnForm] = useState(null);
  const editTxnCats = editTxnForm?.direction === "debit" ? DEBIT_CATEGORIES : CREDIT_CATEGORIES;
  const editItemized = !!editTxnForm && editTxnForm.direction === "debit" && editTxnForm.itemize;
  const editSplit = editTxnForm ? computeSplit(editTxnForm.lines, editTxnForm.players) : null;
  const legacyEditCat = editTxnForm && editTxnForm.category && !editTxnCats.includes(editTxnForm.category) ? editTxnForm.category : null;
  const startEditTxn = (t) => {
    setEditingTxnId(t.id);
    const b = hasBreakdown(t) ? t.breakdown : null;
    setEditTxnForm({
      playerId: t.playerId, date: t.date, direction: t.direction, category: t.category, amount: String(t.amount), description: t.description || "",
      itemize: !!b, hadBreakdown: !!b,
      lines: b ? b.lines.map((l) => ({ label: l.label, amount: String(l.amount), note: l.note || "" })) : (t.category === "Coach Fee" ? defaultCoachLines() : [{ label: "", amount: "", note: "" }]),
      players: b ? String(b.players) : "",
    });
  };
  const saveEditTxn = async () => {
    if (!editTxnForm.playerId) return;
    const itemized = editTxnForm.direction === "debit" && editTxnForm.itemize;
    const split = computeSplit(editTxnForm.lines, editTxnForm.players);
    let amount;
    if (itemized) { if (split.total <= 0 || split.players <= 0) return; amount = split.share; }
    else { if (!editTxnForm.amount || Number(editTxnForm.amount) <= 0) return; amount = parseFloat(editTxnForm.amount); }
    const patch = { playerId: editTxnForm.playerId, date: editTxnForm.date, direction: editTxnForm.direction, category: editTxnForm.category, amount, description: editTxnForm.description.trim() };
    if (itemized) patch.breakdown = { lines: split.lines, total: split.total, players: split.players, share: split.share, exact: split.exact };
    else if (editTxnForm.hadBreakdown) patch.breakdown = null;
    await updateTxn(editingTxnId, patch);
    setEditingTxnId(null); setEditTxnForm(null);
  };

  const bulkFiltered = players.filter((p) => p.name.toLowerCase().includes(bulkQuery.toLowerCase()));
  const toggleOne = (id) => setSelectedIds((prev) => { const next = new Set(prev); next.has(id) ? next.delete(id) : next.add(id); return next; });
  const selectAllFiltered = () => setSelectedIds((prev) => { const next = new Set(prev); bulkFiltered.forEach((p) => next.add(p.id)); return next; });
  const clearAllFiltered = () => setSelectedIds((prev) => { const next = new Set(prev); bulkFiltered.forEach((p) => next.delete(p.id)); return next; });
  const selectActiveOnly = () => setSelectedIds(new Set(players.filter((p) => p.active).map((p) => p.id)));

  const submitBulk = async () => {
    if (selectedIds.size === 0) return;
    if (bulkItemized ? bulkSplit.total <= 0 : (!bulkForm.amount || Number(bulkForm.amount) <= 0)) return;
    setBulkBusy(true); setBulkMsg("");
    try {
      const ids = Array.from(selectedIds);
      const amount = bulkItemized ? bulkSplit.share : parseFloat(bulkForm.amount);
      const base = { date: bulkForm.date, direction: bulkForm.direction, category: bulkForm.category, amount, description: bulkForm.description.trim(), createdAt: Date.now(), ...(bulkForm.direction === "credit" ? { via: bulkForm.via || defaultVia(bulkForm.category) } : {}) };
      if (bulkItemized) base.breakdown = { lines: bulkSplit.lines, total: bulkSplit.total, players: bulkSplit.players, share: bulkSplit.share, exact: bulkSplit.exact };
      await addBulkTxn(ids, base);
      setBulkMsg(`${bulkForm.direction === "debit" ? "Charged" : "Credited"} ${ids.length} player${ids.length === 1 ? "" : "s"} ${fmtMoney(amount)} each.`);
      setSelectedIds(new Set());
      setBulkForm({ ...bulkForm, amount: "", description: "", lines: defaultCoachLines() });
    } catch (e) { setBulkMsg("Something went wrong — please try again."); }
    setBulkBusy(false);
  };

  const playerName = (id) => players.find((p) => p.id === id)?.name || "—";
  const rows = transactions.filter((t) => filterPlayer === "all" || t.playerId === filterPlayer).filter((t) => !filterMonth || t.date.slice(0, 7) === filterMonth).sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));

  return (
    <div>
      <div className="rounded-2xl p-5 mb-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
          <p className="font-black" style={{ color: C.ink }}>Log a Transaction</p>
          <div className="flex rounded-lg overflow-hidden" style={{ border: `1px solid ${C.line}` }}>
            <button onClick={() => setMode("single")} className="px-3 py-1.5 text-sm font-semibold" style={{ background: mode === "single" ? C.pitchTint : "transparent", color: mode === "single" ? C.pitchDark : C.inkSoft }}>Single</button>
            <button onClick={() => setMode("bulk")} className="px-3 py-1.5 text-sm font-semibold" style={{ background: mode === "bulk" ? C.pitchTint : "transparent", color: mode === "bulk" ? C.pitchDark : C.inkSoft }}>Bulk</button>
            <button onClick={() => setMode("family")} className="px-3 py-1.5 text-sm font-semibold" style={{ background: mode === "family" ? C.pitchTint : "transparent", color: mode === "family" ? C.pitchDark : C.inkSoft }}>Family Payment</button>
          </div>
        </div>

        {players.length === 0 ? <p className="text-sm" style={{ color: C.inkSoft }}>Add a player first on the Roster tab.</p> : mode === "family" ? <FamilyPaymentForm players={players} transactions={transactions} /> : mode === "single" ? (<>
          <div className="grid sm:grid-cols-3 gap-3">
            <Field label="Player"><Select value={form.playerId} onChange={(e) => setForm({ ...form, playerId: e.target.value })}>{players.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}</Select></Field>
            <Field label="Date"><TextInput type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
            <Field label="Type"><div className="flex rounded-lg overflow-hidden" style={{ border: `1px solid ${C.line}` }}>

          {editTxnForm.direction === "debit" && (

            </div>

          <div className="flex gap-2 mt-4"><Button onClick={saveEditTxn}>✓ Save Changes</Button><Button variant="ghost" onClick={() => { setEditingTxnId(null); setEditTxnForm(null); }}>Cancel</Button></div>

      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <Select value={filterPlayer} onChange={(e) => setFilterPlayer(e.target.value)} className="w-auto"><option value="all">All Players</option>{players.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}</Select>
        <input type="month" value={filterMonth} onChange={(e) => setFilterMonth(e.target.value)} style={inputStyle} className={`${inputClass} w-auto`} />
        {filterMonth && <button onClick={() => setFilterMonth("")} className="text-xs font-semibold" style={{ color: C.inkSoft }}>Clear Month</button>}
        <ExportButton onExport={() => exportTransactionsPDF(teamName, rows, playerName, filterMonth)} className="ml-auto" />
      </div>
      {rows.length === 0 ? <EmptyState title="No Transactions" body="Logged fees, deposits, and payments will show up here." /> : (
        <div className="rounded-2xl overflow-hidden" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="table-scroll">
          <table className="w-full text-sm">
            <thead><tr className="text-left" style={{ background: C.lineSoft, color: C.inkSoft }}><th className="font-semibold px-4 py-3">Date</th><th className="font-semibold px-4 py-3">Player</th><th className="font-semibold px-4 py-3">Category</th><th className="font-semibold px-4 py-3">Description</th><th className="font-semibold px-4 py-3 text-right">Amount</th><th className="font-semibold px-4 py-3 text-right"></th></tr></thead>
            <tbody>{rows.map((t) => (
              <tr key={t.id} className="border-t" style={{ borderColor: C.lineSoft }}>
                <td className="px-4 py-3" style={{ color: C.ink, whiteSpace: "nowrap" }}>{t.date}</td><td className="px-4 py-3 font-semibold" style={{ color: C.ink, whiteSpace: "nowrap" }}>{playerName(t.playerId)}</td>
                <td className="px-4 py-3"><span className="text-xs font-semibold px-2 py-1 rounded-full" style={{ whiteSpace: "nowrap", display: "inline-block", background: t.direction === "debit" ? C.debitTint : C.creditTint, color: t.direction === "debit" ? C.debit : C.credit }}>{t.category}</span></td>
                <td className="px-4 py-3" style={{ color: C.inkSoft, minWidth: 320 }}>{t.description || (hasBreakdown(t) ? "" : "—")}<BreakdownNote b={t.breakdown} /></td>
                <td className="px-4 py-3 text-right font-bold" style={{ color: t.direction === "debit" ? C.debit : C.credit, fontVariantNumeric: "tabular-nums" }}>{t.direction === "debit" ? "−" : "+"}{fmtMoney(t.amount)}</td>
                <td className="px-4 py-3 text-right"><div className="flex items-center justify-end gap-3">
                  {t.clearedRecId ? <span className="text-xs font-semibold" title="Matched to a bank statement, so it's locked" style={{ color: C.credit, whiteSpace: "nowrap" }}>✓ Reconciled</span> : <><button onClick={() => startEditTxn(t)} className="text-xs font-semibold" style={{ color: C.pitchDark }}>Edit</button>
                  <button onClick={() => { const r = prompt("Void this transaction? It stays in the history but stops counting toward the balance.\n\nReason (required):"); if (r && r.trim()) deleteTxn(t.id, r.trim()); }} title="Void" className="text-xs font-semibold" style={{ color: C.debit }}>Void</button></>}
                </div></td>
              </tr>
            ))}</tbody>
          </table>
          </div>
        </div>
      )}
      <VoidedList playerName={playerName} />
    </div>
  );
}

   Admin: Statements tab
---------------------------------------------------------------- */
function StatementsTab({ teamName, players, ledger, initialPlayerId, onConsumedInitial }) {
  const [month, setMonth] = useState(thisMonthStr());
  const [openPlayerId, setOpenPlayerId] = useState(initialPlayerId || null);
  useEffect(() => { if (initialPlayerId) { setOpenPlayerId(initialPlayerId); onConsumedInitial && onConsumedInitial(); } }, [initialPlayerId]);
  const summary = players.map((p) => ({ player: p, ...ledger.monthStats(p.id, month) }));
  const totals = summary.reduce((a, r) => ({ beginning: a.beginning + r.beginning, debits: a.debits + r.debits, credits: a.credits + r.credits, ending: a.ending + r.ending }), { beginning: 0, debits: 0, credits: 0, ending: 0 });

  if (openPlayerId) {
    const p = players.find((pl) => pl.id === openPlayerId);
    const idx = players.findIndex((pl) => pl.id === openPlayerId);
    if (!p) { setOpenPlayerId(null); return null; }
    return <StatementDetail teamName={teamName} player={p} jerseyNo={jerseyOf(p)} month={month} setMonth={setMonth} stats={ledger.monthStats(p.id, month)} onBack={() => setOpenPlayerId(null)} allowEmail />;
  }
  return (
    <div>
      <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
        <p className="font-black" style={{ color: C.ink }}>Monthly statement — {monthLabel(month)}</p>
        <div className="flex items-center gap-2">
          <input type="month" value={month} onChange={(e) => setMonth(e.target.value)} style={inputStyle} className={`${inputClass} w-auto`} />
          <ExportButton onExport={() => exportSummaryPDF(teamName, summary, totals, month)} />
        </div>
      </div>
      {players.length === 0 ? <EmptyState title="Nothing to Show Yet" body="Add players and transactions to generate statements." /> : (
        <div className="rounded-2xl overflow-hidden" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="table-scroll">
          <table className="w-full text-sm">
            <thead><tr className="text-left" style={{ background: C.lineSoft, color: C.inkSoft }}><th className="font-semibold px-4 py-3">Player</th><th className="font-semibold px-4 py-3 text-right">Beginning</th><th className="font-semibold px-4 py-3 text-right">Debits</th><th className="font-semibold px-4 py-3 text-right">Credits</th><th className="font-semibold px-4 py-3 text-right">Ending</th><th className="font-semibold px-4 py-3 text-right"></th></tr></thead>
            <tbody>{summary.map((r, i) => (
              <tr key={r.player.id} className="border-t" style={{ borderColor: C.lineSoft }}>
                <td className="px-4 py-3"><button onClick={() => setOpenPlayerId(r.player.id)} className="flex items-center gap-2.5 font-bold hover:underline" style={{ color: C.ink }}><JerseyBadge n={jerseyOf(r.player)} space={players.some((x) => jerseyOf(x))} /> {r.player.name}</button></td>
                <td className="px-4 py-3 text-right" style={{ color: C.inkSoft, fontVariantNumeric: "tabular-nums" }}>{fmtMoney(r.beginning)}</td>
                <td className="px-4 py-3 text-right font-semibold" style={{ color: C.debit }}>{r.debits ? fmtMoney(r.debits) : "—"}</td>
                <td className="px-4 py-3 text-right font-semibold" style={{ color: C.credit }}>{r.credits ? fmtMoney(r.credits) : "—"}</td>
                <td className="px-4 py-3 text-right"><MoneyText value={r.ending} /></td>
                <td className="px-4 py-3 text-right"><button onClick={() => setOpenPlayerId(r.player.id)} style={{ color: C.inkSoft }}>›</button></td>
              </tr>
            ))}</tbody>
            <tfoot><tr className="border-t-2" style={{ borderColor: C.line, background: C.lineSoft }}>
              <td className="px-4 py-3 font-black" style={{ color: C.ink }}>Team Total</td>
              <td className="px-4 py-3 text-right font-bold" style={{ color: C.ink }}>{fmtMoney(totals.beginning)}</td>
              <td className="px-4 py-3 text-right font-bold" style={{ color: C.debit }}>{fmtMoney(totals.debits)}</td>
              <td className="px-4 py-3 text-right font-bold" style={{ color: C.credit }}>{fmtMoney(totals.credits)}</td>
              <td className="px-4 py-3 text-right font-bold" style={{ color: C.ink }}>{fmtMoney(totals.ending)}</td>
              <td></td>
            </tr></tfoot>
          </table>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   Admin: Seasons (archive) panel
---------------------------------------------------------------- */
function SeasonsPanel({ teamName, players, transactions, onArchiveSeason }) {
  const [archives, setArchives] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [label, setLabel] = useState("");
  const [carryForward, setCarryForward] = useState(true);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [expandedId, setExpandedId] = useState(null);

  const loadArchives = async () => {
    setLoading(true);
    try {
      const snap = await window.db.collection("archives").where("teamId", "==", window.currentTeamId).get();
      setArchives(snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => String(b.archivedAt).localeCompare(String(a.archivedAt))));
    } catch (e) { setArchives([]); }
    setLoading(false);
  };
  useEffect(() => { loadArchives(); }, []);

  const confirmArchive = async () => {
    if (!confirm(`This moves all ${players.length} players and ${transactions.length} transactions into a permanent "${label.trim() || "Season Archive"}" record and starts a fresh transaction list (the old entries stay saved in the history)${carryForward ? " (each player's current balance becomes their new opening balance)" : " and resets every player's balance to zero"}. This cannot be undone. Continue?`)) return;
    setBusy(true); setMsg("");
    try {
      await onArchiveSeason(label, carryForward);
      setMsg("Season archived — the live roster now starts fresh.");
      setLabel(""); setShowForm(false);
      await loadArchives();
    } catch (e) { setMsg("Something went wrong — please try again."); }
    setBusy(false);
  };

  return (
    <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
      <p className="font-black mb-2" style={{ color: C.ink }}>Seasons</p>
      <p className="text-sm mb-3" style={{ color: C.inkSoft }}>Close out a season by moving its transaction history into a permanent, read-only record — the live roster and balances start clean for the next one. Players stay on the roster; only the transaction ledger and balances reset.</p>

      {!showForm ? (
        <Button variant="ghost" onClick={() => setShowForm(true)}>+ Archive Current Season</Button>
      ) : (
        <div className="rounded-xl p-4 mb-2" style={{ background: C.lineSoft }}>
          <Field label="Season Label" hint='e.g. "2025–2026 Fall Season"'>
            <TextInput value={label} onChange={(e) => setLabel(e.target.value)} placeholder="Season Label" />
          </Field>
          <label className="flex items-center gap-2 mt-3 text-sm" style={{ color: C.ink }}>
            <input type="checkbox" checked={carryForward} onChange={(e) => setCarryForward(e.target.checked)} />
            Carry forward each player's current balance as their new opening balance
          </label>
          <div className="flex items-center gap-3 mt-4 flex-wrap">
            <Button variant="danger" disabled={busy} onClick={confirmArchive}>{busy ? <Spinner size={14} /> : "📦"} Archive & Start Fresh</Button>
            <Button variant="ghost" onClick={() => { setShowForm(false); setLabel(""); }}>Cancel</Button>
          </div>
        </div>
      )}
      {msg && <p className="text-sm font-semibold mt-2 mb-2" style={{ color: C.pitchDark }}>{msg}</p>}

      <div className="mt-5 pt-5" style={{ borderTop: `1px solid ${C.lineSoft}` }}>
        <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: C.inkSoft }}>Past Seasons</p>
        {loading ? <Spinner size={16} /> : archives.length === 0 ? (
          <p className="text-sm" style={{ color: C.inkSoft }}>No archived seasons yet.</p>
        ) : (
          <div className="grid gap-2">
            {archives.map((a) => {
              const archivePlayers = a.players || [];
              const archiveTransactions = a.transactions || [];
              const archiveLedger = buildLedger(archivePlayers, archiveTransactions);
              return (
                <div key={a.id} className="rounded-xl p-3" style={{ border: `1px solid ${C.line}` }}>
                  <button onClick={() => setExpandedId(expandedId === a.id ? null : a.id)} className="w-full flex items-center justify-between text-left">
                    <div>
                      <p className="font-bold text-sm" style={{ color: C.ink }}>{a.label}</p>
                      <p className="text-xs" style={{ color: C.inkSoft }}>Archived {new Date(a.archivedAt).toLocaleDateString()} · {archivePlayers.length} players · {archiveTransactions.length} transactions</p>
                    </div>
                    <span style={{ color: C.inkSoft }}>{expandedId === a.id ? "▾" : "›"}</span>
                  </button>
                  {expandedId === a.id && (
                    <div className="flex items-center gap-3 mt-3 pt-3 flex-wrap" style={{ borderTop: `1px solid ${C.lineSoft}` }}>
                      <ExportButton label="Roster PDF" onExport={() => exportRosterPDF(a.teamName || teamName, archivePlayers, archiveLedger)} />
                      <Button variant="ghost" onClick={() => downloadBackupJSON(a.label, archivePlayers, archiveTransactions)}>⬇ Download JSON</Button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   Admin: Settings tab
---------------------------------------------------------------- */
function SettingsTab({ teamName, setTeamName, parentMessage, setParentMessage, venmoUsername, setVenmoUsername, treasurerEmail, setTreasurerEmail, teamLogo, setTeamLogo, players, transactions, onRestoreBackup, onArchiveSeason }) {
  const { checkPayableTo, setCheckPayableTo, bank } = useContext(TeamCtx);
  const [checkDraft, setCheckDraft] = useState(checkPayableTo || "");
  useEffect(() => setCheckDraft(checkPayableTo || ""), [checkPayableTo]);
  const [name, setName] = useState(teamName);
  useEffect(() => setName(teamName), [teamName]);

  const [logoBusy, setLogoBusy] = useState(false);
  const onLogoFileChosen = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    e.target.value = "";
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { alert("Please choose a PNG or JPG image."); return; }
    if (file.size > 10 * 1024 * 1024) { alert("That image is over 10 MB. Please choose a smaller one."); return; }
    setLogoBusy(true);
    resizeImage(file).then((uri) => setTeamLogo(uri)).catch(() => alert("Couldn't read that image.")).finally(() => setLogoBusy(false));
    e.target.value = "";
  };

  const [msgDraft, setMsgDraft] = useState(parentMessage);
  useEffect(() => setMsgDraft(parentMessage), [parentMessage]);
  const [msgSaved, setMsgSaved] = useState(false);
  const saveMsg = async () => {
    await setParentMessage(msgDraft);
    setMsgSaved(true);
    setTimeout(() => setMsgSaved(false), 1500);
  };

  const [venmoDraft, setVenmoDraft] = useState(venmoUsername);
  useEffect(() => setVenmoDraft(venmoUsername), [venmoUsername]);
  const [venmoSaved, setVenmoSaved] = useState(false);
  const saveVenmo = async () => {
    await setVenmoUsername(venmoDraft.trim().replace(/^@/, ""));
    await setCheckPayableTo(checkDraft.trim());
    setVenmoSaved(true);
    setTimeout(() => setVenmoSaved(false), 1500);
  };

  const [emailDraft, setEmailDraft] = useState(treasurerEmail);
  useEffect(() => setEmailDraft(treasurerEmail), [treasurerEmail]);
  const [emailSaved, setEmailSaved] = useState(false);
  const saveEmail = async () => {
    await setTreasurerEmail(emailDraft.trim());
    setEmailSaved(true);
    setTimeout(() => setEmailSaved(false), 1500);
  };

  const [restorePreview, setRestorePreview] = useState(null);
  const [restoreError, setRestoreError] = useState("");
  const [restoreBusy, setRestoreBusy] = useState(false);
  const [restoreMsg, setRestoreMsg] = useState("");

  const onBackupFileChosen = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setRestoreError(""); setRestoreMsg(""); setRestorePreview(null);
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result || ""));
        if (!Array.isArray(parsed.players) || !Array.isArray(parsed.transactions)) throw new Error("bad shape");
        setRestorePreview(parsed);
      } catch (err) { setRestoreError("That doesn't look like a valid ClubCents backup file."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };
  const confirmRestore = async () => {
    if (!restorePreview) return;
    if (!confirm(`Import ${restorePreview.players.length} players and ${restorePreview.transactions.length} transactions from the backup dated ${new Date(restorePreview.exportedAt).toLocaleString()}?`)) return;
    setRestoreBusy(true); setRestoreMsg("");
    try {
      const r = await onRestoreBackup(restorePreview);
      setRestoreMsg(`Imported ${r.players} players and ${r.transactions} transactions.${r.skipped ? ` Skipped ${r.skipped} that didn't match a player.` : ""}`);
      setRestorePreview(null);
    } catch (err) { setRestoreMsg(err && err.message && err.message.startsWith("Import only") ? err.message : "Something went wrong. Please try again."); }
    setRestoreBusy(false);
  };

  return (
    <div className="grid gap-5 max-w-lg">
      <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <p className="font-black mb-3" style={{ color: C.ink }}>Team Name</p>
        <div className="flex gap-2"><TextInput value={name} onChange={(e) => setName(e.target.value)} /><Button onClick={() => setTeamName(name)}>Save</Button></div>
      </div>
      <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <p className="font-black mb-2" style={{ color: C.ink }}>Team Logo</p>
        <p className="text-sm mb-3" style={{ color: C.inkSoft }}>Shown on the sign in screen and at the top of every page. Use a square PNG or JPG, at least 320 × 320 pixels and under 10 MB. A PNG with a transparent background looks best. Larger images are resized automatically.</p>
        <div className="flex items-center gap-4 flex-wrap">
          {teamLogo ? <img src={teamLogo} alt="Team Logo" style={{ width: 72, height: 72, objectFit: "contain", borderRadius: 12, border: `1px solid ${C.line}` }} /> : <div className="flex items-center justify-center" style={{ width: 72, height: 72, borderRadius: 12, border: `1px solid ${C.line}` }}><CoinMark size={56} /></div>}
          <div className="flex items-center gap-3 flex-wrap">
            <label className="inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold cursor-pointer" style={{ border: `1px solid ${C.line}`, color: C.ink }}>
              {logoBusy ? <Spinner size={14} /> : "📷"} {teamLogo ? "Replace Image" : "Upload Image"}
              <input type="file" accept="image/png,image/jpeg,image/webp" className="hidden" onChange={onLogoFileChosen} />
            </label>
            {teamLogo && <button onClick={() => setTeamLogo("")} className="text-xs font-semibold" style={{ color: C.debit }}>Remove</button>}
          </div>
        </div>
      </div>
      <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <p className="font-black mb-2" style={{ color: C.ink }}>Parent Portal Message</p>
        <p className="text-sm mb-3" style={{ color: C.inkSoft }}>Shown to every parent on their player's account page — good for a quick note like an upcoming payment deadline or a reminder about tournament fees. Up to 500 characters. Leave blank to hide it entirely.</p>
        <TextArea rows={3} maxLength={500} value={msgDraft} onChange={(e) => setMsgDraft(e.target.value.slice(0, 500))} placeholder="e.g. Fall registration fees are due September 15th." />
        <p className="text-xs mt-1" style={{ color: (msgDraft || "").length >= 500 ? C.debit : C.inkSoft, textAlign: "right" }}>{(msgDraft || "").length}/500 characters</p>
        <div className="flex items-center gap-3 mt-3">
          <Button onClick={saveMsg}>Save Message</Button>
          {msgSaved && <p className="text-sm font-semibold" style={{ color: C.pitchDark }}>✓ Saved</p>}
        </div>
      </div>
      <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <p className="font-black mb-2" style={{ color: C.ink }}>Payment Options (Venmo)</p>
        <p className="text-sm mb-3" style={{ color: C.inkSoft }}>Adds a "Make a Payment" button to every parent's account page. Leave the username blank to hide it.</p>
        <Field label="Venmo Username" hint="Just the username, no @ or full link needed">
          <TextInput value={venmoDraft} onChange={(e) => setVenmoDraft(e.target.value)} placeholder="e.g. Jane-Smith" />
        </Field>
        <div className="mt-3"><Field label="Make Checks Payable To" hint="Optional. Shown to parents under the payment button.">
          <TextInput value={checkDraft} onChange={(e) => setCheckDraft(e.target.value)} placeholder="e.g. Your Soccer Club" />
        </Field></div>
        <div className="flex items-center gap-3 mt-3">
          <Button onClick={saveVenmo}>Save Payment Options</Button>
          {venmoSaved && <p className="text-sm font-semibold" style={{ color: C.pitchDark }}>✓ Saved</p>}
        </div>
      </div>
      <TeamAccessPanel />
      <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <p className="font-black mb-2" style={{ color: C.ink }}>Contact Info</p>
        <p className="text-sm mb-3" style={{ color: C.inkSoft }}>Adds a "Message the Treasurer" button to every parent's account page, pre-addressed to this email. Leave blank to hide it.</p>
        <Field label="Treasurer Email">
          <TextInput type="email" value={emailDraft} onChange={(e) => setEmailDraft(e.target.value)} placeholder="you@example.com" />
        </Field>
        <div className="flex items-center gap-3 mt-3">
          <Button onClick={saveEmail}>Save Email</Button>
          {emailSaved && <p className="text-sm font-semibold" style={{ color: C.pitchDark }}>✓ Saved</p>}
        </div>
      </div>
      <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <p className="font-black mb-2" style={{ color: C.ink }}>Backup & Restore</p>
        <p className="text-sm mb-3" style={{ color: C.inkSoft }}>Download a complete copy of every player and transaction. Keep it somewhere safe (email it to yourself, save it to a drive) so you can recover everything if this site or your Firebase project is ever lost.</p>
        <Button variant="ghost" onClick={() => downloadBackupJSON(teamName, players, transactions, bank)}>⬇ Download Full Backup</Button>

        <div className="mt-5 pt-5" style={{ borderTop: `1px solid ${C.lineSoft}` }}>
          <p className="font-black mb-1" style={{ color: C.ink }}>Import a Backup</p>
          <p className="text-sm mb-3" style={{ color: C.inkSoft }}>Bring in players and transactions from a backup file, including one downloaded from the original app. Works only while this team has no players or transactions yet.</p>
          <label className="inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold cursor-pointer" style={{ border: `1px solid ${C.line}`, color: C.ink }}>
            📄 Choose Backup File<input type="file" accept=".json,application/json" className="hidden" onChange={onBackupFileChosen} />
          </label>
          {restoreError && <p className="text-xs font-semibold mt-2" style={{ color: C.debit }}>{restoreError}</p>}
          {restorePreview && (
            <div className="mt-3">
              <p className="text-sm mb-3" style={{ color: C.ink }}>
                Backup from <b>{new Date(restorePreview.exportedAt).toLocaleString()}</b> — {restorePreview.players.length} player{restorePreview.players.length === 1 ? "" : "s"}, {restorePreview.transactions.length} transaction{restorePreview.transactions.length === 1 ? "" : "s"}.
              </p>
              <Button variant="danger" disabled={restoreBusy} onClick={confirmRestore}>{restoreBusy ? <Spinner size={14} /> : "⬆"} Import This Backup</Button>
            </div>
          )}
          {restoreMsg && <p className="text-sm font-semibold mt-2" style={{ color: C.pitchDark }}>{restoreMsg}</p>}
        </div>
      </div>
      <SeasonsPanel teamName={teamName} players={players} transactions={transactions} onArchiveSeason={onArchiveSeason} />
      <div className="rounded-2xl p-5" style={{ background: C.navyTint, border: `1px solid ${C.line}` }}>
        <p className="font-black mb-2" style={{ color: C.navy }}>Data & Security</p>
        <p className="text-sm" style={{ color: C.inkSoft }}>Records are protected by sign in. Only people listed under Team Access can see this team's records, parents see only their own player, and other teams can't see anything here. Transactions can't be deleted or silently changed. Edits and voids keep the original with who did it and why. Don't store bank account numbers or similar here.</p>
      </div>
    </div>
  );
}

   Admin: Dashboard tab
---------------------------------------------------------------- */
function DashboardTab({ players, transactions, ledger, onOpenStatement }) {
  const stats = useMemo(() => {
    let totalOwed = 0, totalCredit = 0;
    const numberOf = players.reduce((acc, p, idx) => (acc[p.id] = idx + 1, acc), {});
    const balances = players.map((p) => ({ player: p, balance: ledger.currentBalance(p.id) }));
    balances.forEach(({ balance }) => { if (balance < -0.004) totalOwed += -balance; else if (balance > 0.004) totalCredit += balance; });
    const owing = balances.filter((b) => b.balance < -0.004).sort((a, b) => a.balance - b.balance).slice(0, 8);
    const thisMonth = thisMonthStr();
    let monthCharged = 0, monthCollected = 0;
    transactions.forEach((t) => { if (t.date.slice(0, 7) === thisMonth) { if (t.direction === "debit") monthCharged += t.amount; else monthCollected += t.amount; } });
    const recent = [...transactions].sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt)).slice(0, 8);
    return { totalOwed, totalCredit, owing, monthCharged, monthCollected, recent, numberOf, activeCount: players.filter((p) => p.active).length };
  }, [players, transactions, ledger]);

  const playerName = (id) => players.find((p) => p.id === id)?.name || "—";

  return (
    <div>
      <div className="grid sm:grid-cols-4 gap-3 mb-5">
        <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: C.inkSoft }}>Active Players</p>
          <p className="text-2xl font-black" style={{ color: C.ink }}>{stats.activeCount}</p>
        </div>
        <button type="button" onClick={() => { const el = document.getElementById("owing-list"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }}
          title="Show players with a balance due" className="rounded-2xl p-4 text-left transition-transform hover:scale-[1.01]" style={{ background: C.debitTint, cursor: "pointer", border: `1px solid ${C.debitTint}` }}>
          <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: C.debit }}>Total Outstanding</p>
          <p className="text-2xl font-black" style={{ color: C.debit }}>{fmtMoney(stats.totalOwed)}</p>
          <p className="text-xs mt-1 font-semibold" style={{ color: C.debit }}>View Players ›</p>
        </button>
        <div className="rounded-2xl p-4" style={{ background: C.creditTint }}>
          <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: C.credit }}>Credit on File</p>
          <p className="text-2xl font-black" style={{ color: C.credit }}>{fmtMoney(stats.totalCredit)}</p>
        </div>
        <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: C.inkSoft }}>Collected This Month</p>
          <p className="text-2xl font-black" style={{ color: C.ink }}>{fmtMoney(stats.monthCollected)}</p>
          <p className="text-xs mt-1" style={{ color: C.inkSoft }}>{fmtMoney(stats.monthCharged)} charged</p>
        </div>
      </div>

      <div className="grid lg:grid-cols-2 gap-5">
        <div id="owing-list" className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}`, scrollMarginTop: 16 }}>
          <p className="font-black mb-3" style={{ color: C.ink }}>Players with a Balance Due</p>
          {stats.owing.length === 0 ? <p className="text-sm" style={{ color: C.inkSoft }}>Nobody currently owes anything. 🎉</p> : (
            <div className="grid gap-1">
              {stats.owing.map(({ player, balance }) => (
                <button key={player.id} onClick={() => onOpenStatement(player.id)} className="flex items-center justify-between py-2 px-1 rounded-lg hover:opacity-80" style={{ borderTop: `1px solid ${C.lineSoft}`, minHeight: 45 }}>
                  <span className="flex items-center gap-2.5 font-semibold text-sm" style={{ color: C.ink }}><JerseyBadge n={jerseyOf(player)} space={players.some((x) => jerseyOf(x))} /> {player.name}</span>
                  <MoneyText value={balance} />
                </button>
              ))}
            </div>
          )}
        </div>
        <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <p className="font-black mb-3" style={{ color: C.ink }}>Recent Activity</p>
          {stats.recent.length === 0 ? <p className="text-sm" style={{ color: C.inkSoft }}>No transactions logged yet.</p> : (
            <div className="grid gap-1">
              {stats.recent.map((t) => (
                <div key={t.id} className="flex items-center justify-between py-2 px-1 text-sm" style={{ borderTop: `1px solid ${C.lineSoft}` }}>
                  <div>
                    <p className="font-semibold" style={{ color: C.ink }}>{playerName(t.playerId)}</p>
                    <p className="text-xs" style={{ color: C.inkSoft }}>{t.date} · {t.category}</p>
                  </div>
                  <span className="font-bold" style={{ color: t.direction === "debit" ? C.debit : C.credit }}>{t.direction === "debit" ? "−" : "+"}{fmtMoney(t.amount)}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   Sign in, teams, and data access
   Security model (enforced by firestore.rules, not just this code):
   - Treasurers/coaches sign in with Google (or an emailed link) and only
     see teams they've been added to.
   - Parents sign in with an emailed link and only see players whose
     parent email on file matches theirs.
---------------------------------------------------------------- */
const TeamCtx = React.createContext({});
const lc = (s) => String(s || "").trim().toLowerCase();
const isEmail = (s) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(lc(s));
const guardianEmailsOf = (p) => [...new Set([lc(p.parentEmail), lc(p.parentEmail2)].filter(Boolean))];
const LINK_EMAIL_KEY = "tt-signin-email", MODE_KEY = "tt-mode", TEAM_KEY = "tt-team", BRAND_KEY = "tt-brand";
const store = {
  get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { window.localStorage.removeItem(k); } catch (e) {} },
};
const siteUrl = () => window.location.origin + window.location.pathname;
const urlParam = (k) => new URLSearchParams(window.location.search).get(k);
// Remember which team's logo/name to show on the sign in screen on this device.
const rememberBrand = (teamId) => { if (teamId) store.set(BRAND_KEY, teamId); };
const signOut = async () => { store.del(MODE_KEY); await window.auth.signOut(); };
function friendlyAuthError(e) {
  const code = (e && e.code) || "";
  if (code === "auth/unauthorized-domain") return "This web address isn't approved in Firebase yet. Add it under Authentication → Settings → Authorized domains.";
  if (code === "auth/operation-not-allowed") return "This sign in method isn't turned on in Firebase yet (Authentication → Sign in method).";
  if (code === "auth/invalid-action-code" || code === "auth/expired-action-code") return "That sign in link has expired or was already used. Request a new one.";
  if (code === "auth/invalid-email") return "That email address doesn't match the one the link was sent to.";
  if (code === "auth/popup-blocked") return "Your browser blocked the Google sign in window. Allow pop-ups for this site and try again.";
  if (code === "auth/network-request-failed") return "Couldn't reach the server. Check your connection and try again.";
  if (code === "auth/web-storage-unsupported") return "Your browser is blocking the storage sign in needs (often a private window or 'block all cookies'). Try a regular window, or use the emailed link instead.";
  if (code === "auth/account-exists-with-different-credential") return "This email already signed in a different way. Use 'Email Me a Sign In Link' instead.";
  if (code === "auth/too-many-requests") return "Too many attempts. Wait a few minutes and try again.";
  if (code === "auth/user-disabled") return "This account has been turned off in Firebase.";
  if (code === "auth/admin-restricted-operation") return "This sign in method isn't allowed for this project. Check Authentication → Sign in method in Firebase.";
  return "Something went wrong signing in. Please try again." + (code ? ` (Error: ${code})` : (e && e.message ? ` (${String(e.message).slice(0, 120)})` : ""));
}
async function commitWrites(writes) {
  // writes: [(batch) => void]; Firestore batches max out at 500 operations.
  for (let i = 0; i < writes.length; i += 400) {
    const batch = window.db.batch();
    writes.slice(i, i + 400).forEach((w) => w(batch));
    await batch.commit();
  }
}
// Shrink uploaded images so the team record stays small and fast to load.
function resizeImage(file, max = 320) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/png"));
      };
      img.src = String(reader.result);
    };
    reader.readAsDataURL(file);
  });
}

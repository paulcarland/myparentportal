/* ---------------------------------------------------------------
   Staff app: one team, scoped to that team's records only
---------------------------------------------------------------- */
function StaffApp({ teamId, role, me, onSwitchTeam, canSwitch }) {
  const [team, setTeam] = useState(null);
  const [rawPlayers, setRawPlayers] = useState(null);
  const [notes, setNotes] = useState({});
  const [allTxns, setAllTxns] = useState(null);
  const [staff, setStaff] = useState([]);
  const [cash, setCash] = useState([]);
  const [recs, setRecs] = useState([]);
  const [loadErr, setLoadErr] = useState("");

  useEffect(() => {
    window.currentTeamId = teamId;
    const db = window.db; const fail = (e) => { console.error(e); setLoadErr("Couldn't load this team's records. You may not have access."); };
    const unsubs = [
      db.collection("teams").doc(teamId).onSnapshot((d) => setTeam(d.exists ? d.data() : {}), fail),
      db.collection("players").where("teamId", "==", teamId).onSnapshot((s) => setRawPlayers(s.docs.map((d) => ({ id: d.id, ...d.data() }))), fail),
      db.collection("transactions").where("teamId", "==", teamId).onSnapshot((s) => setAllTxns(s.docs.map((d) => ({ id: d.id, ...d.data() }))), fail),
      db.collection("staff").where("teamId", "==", teamId).onSnapshot((s) => setStaff(s.docs.map((d) => ({ id: d.id, ...d.data() }))), fail),
      db.collection("cashEntries").where("teamId", "==", teamId).onSnapshot((s) => setCash(s.docs.map((d) => ({ id: d.id, ...d.data() }))), fail),
      db.collection("reconciliations").where("teamId", "==", teamId).onSnapshot((s) => setRecs(s.docs.map((d) => ({ id: d.id, ...d.data() }))), fail),
      db.collection("playerNotes").where("teamId", "==", teamId).onSnapshot((s) => { const m = {}; s.docs.forEach((d) => { m[d.id] = d.data().notes || ""; }); setNotes(m); }, fail),
    ];
    return () => unsubs.forEach((u) => u());
  }, [teamId]);

  // Public branding (name + logo only) so the sign in screen can show the team's logo.
  useEffect(() => {
    if (!team || role === "coach") return;
    rememberBrand(teamId);
    window.db.collection("branding").doc(teamId).set({ teamId, name: team.name || "", logo: team.teamLogo || "" }).catch(console.error);
  }, [team && team.name, team && team.teamLogo]);
  useEffect(() => { rememberBrand(teamId); }, [teamId]);

  const cutoff = (team && team.seasonCutoff) || 0;
  const players = useMemo(() => (rawPlayers || []).map((p) => ({ ...p, notes: notes[p.id] || "" })).sort((a, b) => a.name.localeCompare(b.name)), [rawPlayers, notes]);
  const inSeason = (t) => (Number(t.createdAt) || 0) >= cutoff;
  const transactions = useMemo(() => (allTxns || []).filter((t) => !t.voidedAt && inSeason(t)), [allTxns, cutoff]);
  const voided = useMemo(() => (allTxns || []).filter((t) => t.voidedAt && inSeason(t)).sort((a, b) => String(b.voidedAt).localeCompare(String(a.voidedAt))), [allTxns, cutoff]);

  const db = window.db;
  const playersCol = db.collection("players"), notesCol = db.collection("playerNotes"), txnCol = db.collection("transactions"), teamRef = db.collection("teams").doc(teamId);
  const setTeamField = (field) => async (v) => { await teamRef.update({ [field]: v }); };

  const addPlayer = async (p) => { await addPlayersBulk([p]); };
  const addPlayersBulk = async (list) => {
    const writes = [];
    list.forEach((p) => {
      const { notes: n, accessCode, ...rest } = p;
      const ref = playersCol.doc();
      writes.push((b) => b.set(ref, { ...rest, teamId, guardianEmails: guardianEmailsOf(rest) }));
      if (n) writes.push((b) => b.set(notesCol.doc(ref.id), { teamId, notes: n }));
    });
    await commitWrites(writes);
  };
  const updatePlayer = async (id, patch) => {
    const { notes: n, accessCode, ...rest } = patch;
    const cur = (rawPlayers || []).find((p) => p.id === id) || {};
    const upd = { ...rest };
    if ("parentEmail" in rest || "parentEmail2" in rest) upd.guardianEmails = guardianEmailsOf({ ...cur, ...rest });
    if (Object.keys(upd).length) await playersCol.doc(id).update(upd);
    if (n !== undefined && n !== (notes[id] || "")) await notesCol.doc(id).set({ teamId, notes: n });
  };
  const deletePlayer = async (id) => {
    if ((allTxns || []).some((t) => t.playerId === id)) {
      alert("This player has transaction history, so they can't be deleted. Use Deactivate instead. It hides them from active lists and keeps their records.");
      return;
    }
    await playersCol.doc(id).delete();
    if (notes[id] !== undefined) await notesCol.doc(id).delete();
  };
  const stamp = (t) => ({ ...t, teamId, createdBy: me, createdAt: Number(t.createdAt) || Date.now() });
  const addTxn = async (t) => { await txnCol.add(stamp(t)); };
  const addBulkTxn = async (playerIds, base) => {
    const now = Date.now();
    await commitWrites(playerIds.map((pid) => (b) => b.set(txnCol.doc(), stamp({ createdAt: now, ...base, playerId: pid }))));
  };
  // "Delete" = void with a reason. The record stays, marked void, and stops counting toward balances.
  const deleteTxn = async (id, reason) => {
    await txnCol.doc(id).update({ voidedAt: new Date().toISOString(), voidedBy: me, voidReason: reason || "Voided" });
  };
  // "Edit" = void the original and add a corrected copy, so the history shows both.
  const updateTxn = async (id, patch) => {
    const old = (allTxns || []).find((t) => t.id === id);
    if (!old) return;
    const { id: _i, voidedAt, voidedBy, voidReason, createdBy, clearedRecId, ...base } = old;
    const next = { ...base, ...patch, replaces: id, editedAt: Date.now() };
    if (next.breakdown === null) delete next.breakdown;
    const ref = txnCol.doc();
    const batch = db.batch();
    batch.set(ref, stamp(next));
    batch.update(txnCol.doc(id), { voidedAt: new Date().toISOString(), voidedBy: me, voidReason: "Edited (replaced by a corrected entry)" });
    await batch.commit();
  };
  const archiveSeason = async (label, carryForward) => {
    const balanceOf = (playerId) => {
      const p = players.find((pl) => pl.id === playerId);
      let bal = Number(p && p.openingBalance) || 0;
      for (const t of transactions) { if (t.playerId === playerId) bal += t.direction === "credit" ? t.amount : -t.amount; }
      return Math.round(bal * 100) / 100;
    };
    await db.collection("archives").add({
      teamId, label: label.trim() || `Season archived ${todayStr()}`, archivedAt: new Date().toISOString(),
      teamName: team.name || "", players: players.map((p) => ({ ...p })), transactions: transactions.map((t) => ({ ...t })), voided: voided.map((t) => ({ ...t })),
    });
    const writes = players.map((p) => (b) => b.update(playersCol.doc(p.id), { openingBalance: carryForward ? balanceOf(p.id) : 0 }));
    writes.push((b) => b.update(teamRef, { seasonCutoff: Date.now() }));
    await commitWrites(writes);
  };
  // One-time import of a backup file from the old single-team app (or this one).
  const importBackup = async (backup) => {
    if ((rawPlayers || []).length || (allTxns || []).length) throw new Error("Import only works on a team with no players or transactions yet.");
    const idMap = {}; const writes = [];
    backup.players.forEach((p) => {
      const { id, accessCode, notes: n, guardianEmails, teamId: _t, ...rest } = p;
      const ref = playersCol.doc(); idMap[id] = ref.id;
      writes.push((b) => b.set(ref, { ...rest, active: rest.active !== false, openingBalance: Number(rest.openingBalance) || 0, teamId, guardianEmails: guardianEmailsOf(rest) }));
      if (n) writes.push((b) => b.set(notesCol.doc(ref.id), { teamId, notes: n }));
    });
    let skipped = 0;
    backup.transactions.forEach((t) => {
      const { id, teamId: _t, createdBy, voidedAt, voidedBy, voidReason, clearedRecId, ...rest } = t;
      if (voidedAt || !idMap[t.playerId] || !(Number(rest.amount) > 0)) { skipped++; return; }
      // Imported records are the old app's *current* season, so they must land after any
      // earlier season archive on this team (otherwise they'd be treated as past history).
      const orig = Number(rest.createdAt) || 0;
      writes.push((b) => b.set(txnCol.doc(), stamp({ ...rest, amount: Number(rest.amount), playerId: idMap[t.playerId], importedFrom: id, createdAt: Math.max(orig, cutoff + 1), originalCreatedAt: orig })));
    });
    await commitWrites(writes);
    return { players: backup.players.length, transactions: backup.transactions.length - skipped, skipped };
  };
  const addTxns = async (list) => { const now = Date.now(); await commitWrites(list.map((t) => (b) => b.set(txnCol.doc(), stamp({ createdAt: now, ...t })))); };
  // --- bank reconciliation ---
  const cashCol = db.collection("cashEntries");
  const addCash = async (e) => { await cashCol.add({ ...e, teamId, createdBy: me, createdAt: Date.now() }); };
  const voidCash = async (id, reason) => { await cashCol.doc(id).update({ voidedAt: new Date().toISOString(), voidedBy: me, voidReason: reason }); };
  const setBankStart = async (v) => { await teamRef.update({ bankStart: v }); };
  const finishReconciliation = async ({ statementDate, endingBalance, opening, items }) => {
    const recRef = db.collection("reconciliations").doc();
    const writes = [(b) => b.set(recRef, { teamId, statementDate, endingBalance, opening, clearedCount: items.length,
      clearedTotal: Math.round(items.reduce((x, i) => x + i.signed, 0) * 100) / 100, createdBy: me, createdAt: Date.now() })];
    items.forEach((i) => writes.push((b) => b.update(db.collection(i.src === "txn" ? "transactions" : "cashEntries").doc(i.id), { clearedRecId: recRef.id })));
    await commitWrites(writes);
  };
  const addStaff = async (email, role2) => {
    const em = lc(email);
    await db.collection("staff").doc(teamId + "__" + em).set({ teamId, email: em, role: role2, name: "" });
  };
  const removeStaff = async (email) => { await db.collection("staff").doc(teamId + "__" + lc(email)).delete(); };

  if (loadErr) return <Shell><p className="text-sm" style={{ color: C.debit }}>⚠ {loadErr}</p><button onClick={signOut} className="text-sm font-semibold mt-4" style={{ color: C.pitchDark }}>Sign Out</button></Shell>;
  if (!team || !rawPlayers || !allTxns) return <div className="min-h-screen flex items-center justify-center" style={{ background: C.bg }}><Spinner size={22} /></div>;

  const teamName = team.name || "ClubCents";
  const ctx = { teamId, role, me, staff, voided, importBackup, addStaff, removeStaff, onSwitchTeam, canSwitch, checkPayableTo: team.checkPayableTo || "", setCheckPayableTo: setTeamField("checkPayableTo"), teamLogo: team.teamLogo || "", addTxns,
    bank: { start: team.bankStart || null, setBankStart, cash, recs, addCash, voidCash, finishReconciliation, allTxns: allTxns || [], players } };
  if (role === "coach") return <TeamCtx.Provider value={ctx}><CoachView teamName={teamName} players={players} transactions={transactions} onLogout={signOut} /></TeamCtx.Provider>;
  return (
    <TeamCtx.Provider value={ctx}>
      <AdminShell teamName={teamName} setTeamName={setTeamField("name")} parentMessage={team.parentMessage || ""} setParentMessage={setTeamField("parentMessage")}
        venmoUsername={team.venmoUsername || ""} setVenmoUsername={setTeamField("venmoUsername")} treasurerEmail={team.treasurerEmail || ""} setTreasurerEmail={setTeamField("treasurerEmail")}
        teamLogo={team.teamLogo || ""} setTeamLogo={setTeamField("teamLogo")}
        players={players} transactions={transactions} addPlayer={addPlayer} addPlayersBulk={addPlayersBulk} updatePlayer={updatePlayer} deletePlayer={deletePlayer}
        addTxn={addTxn} addBulkTxn={addBulkTxn} deleteTxn={deleteTxn} updateTxn={updateTxn}
        onLock={signOut} onRestoreBackup={importBackup} onArchiveSeason={archiveSeason} />
    </TeamCtx.Provider>
  );
}

  const [pickedId, setPickedId] = useState(kids.length === 1 ? kids[0].id : null);
  const [teams, setTeams] = useState({});   // teamId -> team doc
  const [txnsBy, setTxnsBy] = useState({}); // playerId -> transactions
  const kidKey = kids.map((k) => k.id + ":" + k.teamId).join(",");
  useEffect(() => {
    const unsubs = [];
    [...new Set(kids.map((k) => k.teamId))].forEach((tid) => {
      unsubs.push(window.db.collection("teams").doc(tid).onSnapshot((d) => setTeams((t) => ({ ...t, [tid]: d.exists ? d.data() : {} })), console.error));
    });
    kids.forEach((k) => {
      unsubs.push(window.db.collection("transactions").where("teamId", "==", k.teamId).where("playerId", "==", k.id)

  const balanceOf = (k) => Math.round(buildLedger([k], visibleFor(k)).currentBalance(k.id) * 100) / 100;

  const total = kids.reduce((s, k) => s + balanceOf(k), 0);

            <div><p className="font-black text-lg">{kids.length} players</p><p className="text-xs opacity-80">{totalLabel}</p></div>
            <span className="text-2xl font-black" style={{ fontVariantNumeric: "tabular-nums" }}>{fmtMoney(Math.abs(total))}</span>
          </div>
          {payments.length > 0 && (

                </a>

            </div>

          <div className="grid gap-2">
            {kids.map((k) => {
              const bal = balanceOf(k);

  const [creating, setCreating] = useState(false);

  // Finish an emailed sign in link if this page was opened from one.
  useEffect(() => {
    const auth = window.auth;
    if (!auth.isSignInWithEmailLink(window.location.href)) return;
    // Firebase puts our return address (with ?em=) inside the link's continueUrl.
    let fromLink = urlParam("em");
    try { const cu = urlParam("continueUrl"); if (!fromLink && cu) fromLink = new URL(cu).searchParams.get("em"); } catch (e) {}
    let em = fromLink || store.get(LINK_EMAIL_KEY);
    if (!em) em = window.prompt("To finish signing in, confirm the email address the link was sent to:");
    const clean = () => window.history.replaceState(null, "", siteUrl());
    if (!em) { clean(); return; }
    auth.signInWithEmailLink(lc(em), window.location.href)
      .then(() => { store.del(LINK_EMAIL_KEY); clean(); })
      .catch((e) => { setLinkErr(friendlyAuthError(e)); clean(); });
  }, []);

  useEffect(() => window.auth.onAuthStateChanged((u) => { setUser(u || null); setMemberships(null); setKids(null); setTeams({}); if (!u) { setPicked(null); setCreating(false); } }), []);

  const me = user && user.email ? lc(user.email) : "";
  useEffect(() => {
    if (!me) return;
    const db = window.db;
    // Only count memberships the server has confirmed. A just-created team shows up locally a
    // moment before it's saved, and the security rules (rightly) refuse to load it until then.
    const u1 = db.collection("staff").where("email", "==", me).onSnapshot({ includeMetadataChanges: true }, (s) => setMemberships(s.docs.filter((d) => !(d.metadata && d.metadata.hasPendingWrites)).map((d) => d.data())), (e) => { console.error(e); setMemberships([]); });
    const u2 = db.collection("players").where("guardianEmails", "array-contains", me).onSnapshot((s) => setKids(s.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name))), (e) => { console.error(e); setKids([]); });
    return () => { u1(); u2(); };
  }, [me]);
  useEffect(() => {
    (memberships || []).forEach((m) => {
      if (teams[m.teamId]) return;
      window.db.collection("teams").doc(m.teamId).get().then((d) => setTeams((t) => ({ ...t, [m.teamId]: d.data() || {} })));
    });
  }, [memberships]);

  const pickTeam = (id) => { store.set(TEAM_KEY, id); setTeamId(id); setCreating(false); };
  const spinner = <div className="min-h-screen flex items-center justify-center" style={{ background: C.bg }}><Spinner size={22} /></div>;

  if (user === undefined) return spinner;
  if (!user) {
    if (linkErr) return <Shell onBack={() => setLinkErr("")}><p className="text-sm" style={{ color: C.debit }}>⚠ {linkErr}</p></Shell>;
    if (!picked) return <Landing onPick={(m) => { store.set(MODE_KEY, m); setPicked(m); }} />;
    return <SignInScreen mode={picked} onBack={() => setPicked(null)} />;
  }
  if (!user.email || !user.emailVerified) return (
    <Shell><p className="text-sm" style={{ color: C.ink }}>This account doesn't have a verified email address, so it can't be used here.</p><Button variant="ghost" className="mt-4" onClick={signOut}>Sign Out</Button></Shell>
  );
  if (memberships === null || kids === null) return spinner;

  const mode = store.get(MODE_KEY) || (memberships.length ? "staff" : "parent");
  if (mode === "parent") return <ParentApp me={me} kids={kids} />;

  if (creating || memberships.length === 0) return <CreateTeam me={me} onCreated={pickTeam} />;
  const current = memberships.find((m) => m.teamId === teamId) || (memberships.length === 1 ? memberships[0] : null);
  if (!current) return <TeamPicker memberships={memberships} teams={teams} onPick={pickTeam} onCreate={() => setCreating(true)} />;
  return <StaffApp key={current.teamId} teamId={current.teamId} role={current.role} me={me} canSwitch={memberships.length > 1} onSwitchTeam={() => { store.del(TEAM_KEY); setTeamId(null); }} />;
}

/* ---------------------------------------------------------------
   Treasurer: record one family payment across siblings
---------------------------------------------------------------- */
function familiesOf(players) {
  const groups = {};
  players.forEach((p) => guardianEmailsOf(p).forEach((e) => { (groups[e] = groups[e] || []).push(p); }));
  const seen = new Set(); const out = [];
  Object.entries(groups).forEach(([email, ps]) => {
    if (ps.length < 2) return;
    const key = ps.map((p) => p.id).sort().join(",");
    if (seen.has(key)) return; seen.add(key);
    const parent = ps.map((p) => (lc(p.parentEmail) === email ? p.parentName : lc(p.parentEmail2) === email ? p.parentName2 : "")).find(Boolean) || email;
    out.push({ key, email, parent, players: ps });
  });
  return out.sort((a, b) => a.parent.localeCompare(b.parent));
}

function FamilyPaymentForm({ players, transactions }) {
  const { addTxns } = useContext(TeamCtx);
  const families = useMemo(() => familiesOf(players), [players]);
  const ledger = useMemo(() => buildLedger(players, transactions), [players, transactions]);
  const [famKey, setFamKey] = useState("");
  const [total, setTotal] = useState(""); const [date, setDate] = useState(todayStr());
  const [category, setCategory] = useState(CREDIT_CATEGORIES[0]); const [description, setDescription] = useState("");
  const [split, setSplit] = useState({}); const [busy, setBusy] = useState(false); const [msg, setMsg] = useState("");
  const [via, setVia] = useState("venmo");
  const fam = families.find((f) => f.key === famKey);
  const owed = (id) => Math.max(0, Math.round(-ledger.currentBalance(id) * 100) / 100);

  // Default split: pay off what each player owes, then put anything extra on the first player as credit.
  const autoSplit = (amount, f = fam) => {
    if (!f) return;
    let left = Math.round((parseFloat(amount) || 0) * 100);
    const next = {};
    f.players.forEach((p) => { const c = Math.min(left, Math.round(owed(p.id) * 100)); next[p.id] = c; left -= c; });
    if (left > 0) next[f.players[0].id] += left;
    setSplit(Object.fromEntries(Object.entries(next).map(([k, c]) => [k, (c / 100).toFixed(2)])));
  };
  const totalCents = Math.round((parseFloat(total) || 0) * 100);
  const splitCents = fam ? fam.players.reduce((s, p) => s + Math.round((parseFloat(split[p.id]) || 0) * 100), 0) : 0;
  const valid = fam && totalCents > 0 && splitCents === totalCents;

  const submit = async () => {
    if (!valid) return;
    setBusy(true); setMsg("");
    const groupId = "fam_" + Date.now().toString(36);
    const note = description.trim() || `Family payment (${fmtMoney(totalCents / 100)} total for ${fam.players.map((p) => p.name.split(" ")[0]).join(" & ")})`;
    try {
      await addTxns(fam.players.filter((p) => (parseFloat(split[p.id]) || 0) > 0).map((p) => ({
        playerId: p.id, date, direction: "credit", category, amount: Math.round(parseFloat(split[p.id]) * 100) / 100, description: note, familyPaymentId: groupId, via,
      })));
      setMsg(`✓ Recorded ${fmtMoney(totalCents / 100)} across ${fam.players.length} players.`);
      setTotal(""); setSplit({}); setDescription("");
    } catch (e) { console.error(e); setMsg("Something went wrong. Please try again."); }
    setBusy(false);
  };

  if (!families.length) return <p className="text-sm" style={{ color: C.inkSoft }}>No families with more than one player yet. Families are matched by a parent email that appears on two or more players.</p>;
  return (
    <div className="grid gap-3">
      <Field label="Family">
        <Select value={famKey} onChange={(e) => { setFamKey(e.target.value); setMsg(""); const f = families.find((x) => x.key === e.target.value); if (f && total) autoSplit(total, f); else setSplit({}); }}>
          <option value="">Choose a Family…</option>
          {families.map((f) => <option key={f.key} value={f.key}>{f.parent}: {f.players.map((p) => p.name).join(", ")}</option>)}
        </Select>
      </Field>
      {fam && (<>
        <div className="grid sm:grid-cols-3 gap-3">
          <Field label="Total Received"><TextInput type="number" min="0" step="0.01" value={total} onChange={(e) => { setTotal(e.target.value); autoSplit(e.target.value); }} placeholder="0.00" /></Field>
          <Field label="Date"><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
          <Field label="Category"><Select value={category} onChange={(e) => { setCategory(e.target.value); setVia(defaultVia(e.target.value)); }}>{CREDIT_CATEGORIES.map((c) => <option key={c}>{c}</option>)}</Select></Field>
        </div>
        <Field label="Received Via"><Select value={via} onChange={(e) => setVia(e.target.value)}>{VIA_OPTIONS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}</Select></Field>
        <div className="rounded-xl p-3" style={{ border: `1px solid ${C.lineSoft}` }}>
          <p className="text-xs font-semibold mb-2" style={{ color: C.inkSoft }}>Split between players (filled in to pay off what each owes, so adjust if needed)</p>
          {fam.players.map((p) => (
            <div key={p.id} className="flex items-center justify-between gap-3 py-1">
              <span className="text-sm" style={{ color: C.ink }}>{p.name} <span className="text-xs" style={{ color: C.inkSoft }}>· owes {fmtMoney(owed(p.id))}</span></span>
              <TextInput type="number" min="0" step="0.01" value={split[p.id] || ""} onChange={(e) => setSplit({ ...split, [p.id]: e.target.value })} style={{ width: 120 }} />
            </div>
          ))}
          {totalCents > 0 && splitCents !== totalCents && <p className="text-xs font-semibold mt-2" style={{ color: C.debit }}>⚠ Split adds up to {fmtMoney(splitCents / 100)}, not {fmtMoney(totalCents / 100)}.</p>}
        </div>
        <Field label="Description (Optional)"><TextInput value={description} onChange={(e) => setDescription(e.target.value)} placeholder="e.g. Venmo, one payment for both" /></Field>
        <div className="flex items-center gap-3"><Button disabled={!valid || busy} onClick={submit}>{busy ? <Spinner size={14} color="#fff" /> : "+"} Record Family Payment</Button></div>
      </>)}
      {msg && <p className="text-sm font-semibold" style={{ color: C.pitchDark }}>{msg}</p>}
    </div>
  );
}

/* Two-position sliding switch (e.g. This month | Full season) */
function ViewSwitch({ value, onChange, options }) {
  const idx = Math.max(0, options.findIndex(([v]) => v === value));
  return (
    <div role="radiogroup" className="inline-flex" style={{ position: "relative", background: C.lineSoft, border: `1px solid ${C.line}`, borderRadius: 999, padding: 3 }}>
      <span aria-hidden="true" style={{
        position: "absolute", top: 3, bottom: 3, left: 3, width: `calc((100% - 6px) / ${options.length})`,
        transform: `translateX(${idx * 100}%)`, transition: "transform 200ms ease",
        background: C.pitchDark, borderRadius: 999, boxShadow: "0 1px 3px rgba(0,0,0,0.18)",
      }} />
      {options.map(([v, label]) => (
        <button key={v} role="radio" aria-checked={v === value} onClick={() => onChange(v)} className="text-sm font-semibold"
          style={{ position: "relative", zIndex: 1, flex: "1 1 0%", minWidth: 116, padding: "7px 16px", borderRadius: 999, background: "transparent", color: v === value ? "#fff" : C.inkSoft, transition: "color 200ms ease", cursor: "pointer" }}>
          {label}
        </button>
      ))}
    </div>
  );
}

/* ---------------------------------------------------------------
   Bank tab: balance the app against the team bank account
---------------------------------------------------------------- */
const VIA_OPTIONS = [["venmo", "Venmo (to Treasurer)"], ["bank", "Bank Deposit (Cash or Check)"], ["none", "Not Money (Credit or Discount)"]];
const defaultVia = (category) => (category === "Player Account Payment" ? "venmo" : "none");
const EXPENSE_CATEGORIES = ["Coach Payment", "Tournament Entry", "League Fees", "Referees", "Uniforms & Equipment", "Field Rental", "Bank Fee", "Refund to Family", "Other"];
const INCOME_CATEGORIES = ["Sponsor", "Fundraiser", "Donation", "Bank Interest", "Other"];
const r2 = (n) => Math.round(n * 100) / 100;

function useBankModel() {
  const { bank } = useContext(TeamCtx);
  const { start, cash, recs, allTxns, players } = bank;
  return useMemo(() => {
    if (!start) return null;
    const after = (d) => String(d || "") > start.date;
    const name = (id) => (players.find((p) => p.id === id) || {}).name || "—";
    const live = (x) => !x.voidedAt;
    const pays = allTxns.filter((t) => live(t) && t.direction === "credit" && after(t.date));
    const bankPays = pays.filter((t) => t.via === "bank");
    const venmoPays = pays.filter((t) => t.via === "venmo");
    const entries = cash.filter((c) => live(c) && after(c.date));
    const sum = (arr) => r2(arr.reduce((x, i) => x + Number(i.amount), 0));
    const expenses = entries.filter((c) => c.kind === "expense"), income = entries.filter((c) => c.kind === "income"), transfers = entries.filter((c) => c.kind === "transfer");
    // Every item that moves money in or out of the bank, signed (+ in, − out)
    const items = [
      ...bankPays.map((t) => ({ id: t.id, src: "txn", date: t.date, signed: Number(t.amount), label: `${name(t.playerId)} · ${t.category}`, note: t.description || "", cleared: !!t.clearedRecId })),
      ...income.map((c) => ({ id: c.id, src: "cash", date: c.date, signed: Number(c.amount), label: `Deposit · ${c.category}`, note: c.description || "", cleared: !!c.clearedRecId, voidable: true })),
      ...transfers.map((c) => ({ id: c.id, src: "cash", date: c.date, signed: Number(c.amount), label: "Venmo transfer to bank", note: c.description || "", cleared: !!c.clearedRecId, voidable: true })),
      ...expenses.map((c) => ({ id: c.id, src: "cash", date: c.date, signed: -Number(c.amount), label: `Expense · ${c.category}`, note: c.description || "", cleared: !!c.clearedRecId, voidable: true })),
    ].sort((a, b) => b.date.localeCompare(a.date));
    const expected = r2(Number(start.balance) + sum(bankPays) + sum(income) + sum(transfers) - sum(expenses));
    const venmoWaiting = r2(sum(venmoPays) - sum(transfers));
    const sortedRecs = [...recs].sort((a, b) => String(b.statementDate).localeCompare(String(a.statementDate)) || (b.createdAt || 0) - (a.createdAt || 0));
    const last = sortedRecs[0] || null;
    return { items, expected, venmoWaiting, venmoReceived: sum(venmoPays), transferred: sum(transfers), recs: sortedRecs, last, opening: last ? Number(last.endingBalance) : Number(start.balance) };
  }, [start, cash, recs, allTxns, players]);
}

    <Card>
      <p className="font-black mb-2" style={{ color: C.ink }}>Set Your Starting Point</p>

      <div className="grid sm:grid-cols-2 gap-3">

        {existing && <button onClick={onDone} className="text-sm font-semibold" style={{ color: C.inkSoft }}>Cancel</button>}</div>

      setAmount(""); setDescription("");

          {tabs.map(([k, l]) => <button key={k} onClick={() => pick(k)} className="px-3 py-1.5 text-sm font-semibold" style={{ whiteSpace: "nowrap", background: kind === k ? C.pitchTint : "transparent", color: kind === k ? C.pitchDark : C.inkSoft }}>{l}</button>)}
        </div>
      </div>
      <p className="text-xs mb-3" style={{ color: C.inkSoft }}>{kind === "expense" ? "Money paid out of the team bank account (coach, tournament entry, referees, bank fees)." : kind === "income" ? "Money deposited that isn't a player payment (sponsors, fundraisers, donations)." : "When you move team money from your Venmo into the team bank account. Record the amount that arrived in the bank."}</p>
      <div className="grid sm:grid-cols-3 gap-3">
        <Field label="Date"><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
        <Field label="Amount"><TextInput type="number" min="0" step="0.01" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0.00" /></Field>
        {kind !== "transfer" && <Field label="Category"><Select value={category} onChange={(e) => setCategory(e.target.value)}>{(kind === "expense" ? EXPENSE_CATEGORIES : INCOME_CATEGORIES).map((c) => <option key={c}>{c}</option>)}</Select></Field>}
      </div>
      <div className="mt-3"><Field label="Description (Optional)"><TextInput value={description} onChange={(e) => setDescription(e.target.value)} placeholder={kind === "expense" ? "e.g. Check #104, Heartland Invitational entry" : kind === "income" ? "e.g. Smith Plumbing sponsorship" : "e.g. Venmo transfer 11/20"} /></Field></div>
      <div className="flex items-center gap-3 mt-4 flex-wrap"><Button disabled={busy || !(parseFloat(amount) > 0)} onClick={save}>{busy ? <Spinner size={14} color="#fff" /> : "+"} Record {kind === "expense" ? "Expense" : kind === "income" ? "Deposit" : "Transfer"}</Button>
        {msg && <p className="text-sm font-semibold" style={{ color: C.pitchDark }}>{msg}</p>}</div>
    </Card>

}

function ReconcilePanel({ model }) {
  const { bank } = useContext(TeamCtx);
  const [stmtDate, setStmtDate] = useState(todayStr()); const [stmtBal, setStmtBal] = useState("");
  const [checked, setChecked] = useState(() => new Set()); const [busy, setBusy] = useState(false); const [msg, setMsg] = useState("");
  const open = model.items.filter((i) => !i.cleared && i.date <= stmtDate).sort((a, b) => a.date.localeCompare(b.date));
  const clearedSum = r2(open.filter((i) => checked.has(i.id)).reduce((x, i) => x + i.signed, 0));
  const clearedBalance = r2(model.opening + clearedSum);
  const hasBal = stmtBal !== "" && !isNaN(parseFloat(stmtBal));
  const diff = hasBal ? r2(parseFloat(stmtBal) - clearedBalance) : null;
  const balanced = hasBal && Math.abs(diff) < 0.005;
  const toggle = (id) => setChecked((prev) => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const finish = async () => {
    if (!balanced) return;
    if (model.last && stmtDate <= model.last.statementDate) { alert(`This statement date must be after your last reconciliation (${model.last.statementDate}).`); return; }
    setBusy(true); setMsg("");
    try {
      await bank.finishReconciliation({ statementDate: stmtDate, endingBalance: r2(parseFloat(stmtBal)), opening: model.opening, items: open.filter((i) => checked.has(i.id)) });
      setMsg(`✓ Reconciled through ${stmtDate}. Those items are now locked.`); setChecked(new Set()); setStmtBal("");
    } catch (e) { console.error(e); setMsg("Something went wrong. Please try again."); }
    setBusy(false);
  };
  return (
    <Card>
      <p className="font-black mb-1" style={{ color: C.ink }}>Reconcile a Bank Statement</p>
      <p className="text-sm mb-3" style={{ color: C.inkSoft }}>Enter your statement's end date and ending balance, then tick each item that appears on the statement. When the difference is $0.00 you're balanced.</p>
      <div className="grid sm:grid-cols-3 gap-3 mb-3">
        <Field label="Statement End Date"><TextInput type="date" value={stmtDate} onChange={(e) => { setStmtDate(e.target.value); setChecked(new Set()); }} /></Field>
        <Field label="Ending Balance"><TextInput type="number" step="0.01" value={stmtBal} onChange={(e) => setStmtBal(e.target.value)} placeholder="0.00" /></Field>
        <Field label="Starting From"><div className="text-sm py-2" style={{ color: C.ink }}>{fmtMoney(model.opening)} <span className="text-xs" style={{ color: C.inkSoft }}>{model.last ? `(reconciled ${model.last.statementDate})` : "(starting point)"}</span></div></Field>
      </div>
      {open.length === 0 ? <p className="text-sm" style={{ color: C.inkSoft }}>No uncleared items dated on or before {stmtDate}.</p> : (
        <div className="rounded-xl overflow-hidden" style={{ border: `1px solid ${C.lineSoft}` }}>
          <div className="flex items-center justify-between px-3 py-2 text-xs font-semibold" style={{ background: C.lineSoft, color: C.inkSoft }}>
            <span>{open.length} uncleared item{open.length === 1 ? "" : "s"}</span>
            <button onClick={() => setChecked(checked.size === open.length ? new Set() : new Set(open.map((i) => i.id)))} style={{ color: C.pitchDark }}>{checked.size === open.length ? "Clear All" : "Tick All"}</button>
          </div>
          {open.map((i) => (
            <label key={i.id} className="flex items-center justify-between gap-3 px-3 py-2 cursor-pointer" style={{ borderTop: `1px solid ${C.lineSoft}`, background: checked.has(i.id) ? C.pitchTint : "transparent" }}>
              <span className="flex items-center gap-3 min-w-0">
                <input type="checkbox" checked={checked.has(i.id)} onChange={() => toggle(i.id)} style={{ width: 18, height: 18, flexShrink: 0 }} />
                <span className="text-sm" style={{ color: C.ink, whiteSpace: "nowrap" }}>{i.date}</span>
                <span className="text-sm truncate" style={{ color: C.ink }}>{i.label}{i.note ? <span style={{ color: C.inkSoft }}> · {i.note}</span> : null}</span>
              </span>
              <span className="text-sm font-bold" style={{ color: i.signed < 0 ? C.debit : C.credit, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>{i.signed < 0 ? "−" : "+"}{fmtMoney(Math.abs(i.signed))}</span>
            </label>
          ))}
        </div>
      )}
      <div className="grid sm:grid-cols-3 gap-3 mt-4">
        <div className="rounded-xl p-3" style={{ background: C.lineSoft }}><p className="text-xs font-semibold" style={{ color: C.inkSoft }}>Cleared Balance</p><p className="text-lg font-black" style={{ color: C.ink }}>{fmtMoney(clearedBalance)}</p></div>
        <div className="rounded-xl p-3" style={{ background: C.lineSoft }}><p className="text-xs font-semibold" style={{ color: C.inkSoft }}>Statement Balance</p><p className="text-lg font-black" style={{ color: C.ink }}>{hasBal ? fmtMoney(parseFloat(stmtBal)) : "—"}</p></div>
        <div className="rounded-xl p-3" style={{ background: !hasBal ? C.lineSoft : balanced ? C.creditTint : C.debitTint }}><p className="text-xs font-semibold" style={{ color: !hasBal ? C.inkSoft : balanced ? C.credit : C.debit }}>Difference</p><p className="text-lg font-black" style={{ color: !hasBal ? C.ink : balanced ? C.credit : C.debit }}>{hasBal ? (balanced ? "$0.00 ✓" : fmtMoney(diff)) : "—"}</p></div>
      </div>
      {hasBal && !balanced && <p className="text-xs mt-2" style={{ color: C.inkSoft }}>Not balanced yet. Check for items on the statement that aren't ticked, items ticked by mistake, or bank activity not recorded here (a fee, a deposit, a Venmo transfer).</p>}
      <div className="flex items-center gap-3 mt-4 flex-wrap"><Button disabled={!balanced || busy} onClick={finish}>{busy ? <Spinner size={14} color="#fff" /> : "✓"} Finish Reconciliation</Button>
        {msg && <p className="text-sm font-semibold" style={{ color: C.pitchDark }}>{msg}</p>}</div>
    </Card>
  );
}

function BankTab() {
  const { bank, role } = useContext(TeamCtx);
  const model = useBankModel();
  const [editingStart, setEditingStart] = useState(false);
  if (!bank.start || editingStart) return <div className="grid gap-5 max-w-2xl"><BankStartForm existing={bank.start} onDone={() => setEditingStart(false)} /></div>;
  const voidItem = async (i) => {
    const r = prompt("Void this entry? It stays in the history but stops counting.\n\nReason (required):");

  };
  return (
    <div className="grid gap-5">

          <p className="text-xs font-semibold uppercase tracking-wide" style={{ opacity: 0.8 }}>Expected Bank Balance</p>
          <p className="text-2xl font-black">{fmtMoney(model.expected)}</p>
          <p className="text-xs mt-1" style={{ opacity: 0.8 }}>What the bank should show if everything has cleared</p>

          <p className="text-2xl font-black" style={{ color: model.venmoWaiting < -0.004 ? C.debit : C.ink }}>{fmtMoney(model.venmoWaiting)}</p>
          <p className="text-xs mt-1" style={{ color: C.inkSoft }}>{model.venmoWaiting < -0.004 ? "More transferred than received. Check Received Via on recent payments." : `Team money still in your Venmo: received ${fmtMoney(model.venmoReceived)}, transferred to bank ${fmtMoney(model.transferred)}`}</p>
        </div>
        <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: C.inkSoft }}>Last Reconciled</p>
          <p className="text-2xl font-black" style={{ color: C.ink }}>{model.last ? fmtMoney(model.last.endingBalance) : "Not Yet"}</p>
          <p className="text-xs mt-1" style={{ color: C.inkSoft }}>{model.last ? `Statement ending ${model.last.statementDate}` : `Starting point ${bank.start.date}: ${fmtMoney(bank.start.balance)}`}</p>

      </div>
      <div className="grid lg:grid-cols-2 gap-5 items-start">

        <ReconcilePanel model={model} />
      </div>
      <Card>
        <p className="font-black mb-3" style={{ color: C.ink }}>Bank Activity Since {bank.start.date}</p>
        {model.items.length === 0 ? <p className="text-sm" style={{ color: C.inkSoft }}>Nothing yet. Bank deposits from parents, expenses, other deposits and Venmo transfers will appear here.</p> : (
          <div className="table-scroll"><table className="w-full text-sm">
            <thead><tr className="text-left" style={{ background: C.lineSoft, color: C.inkSoft }}><th className="font-semibold px-4 py-3">Date</th><th className="font-semibold px-4 py-3">Item</th><th className="font-semibold px-4 py-3 text-right">Amount</th><th className="font-semibold px-4 py-3">Status</th></tr></thead>
            <tbody>{model.items.map((i) => (
              <tr key={i.src + i.id} className="border-t" style={{ borderColor: C.lineSoft }}>
                <td className="px-4 py-3" style={{ color: C.ink, whiteSpace: "nowrap" }}>{i.date}</td>
                <td className="px-4 py-3" style={{ color: C.ink }}>{i.label}{i.note ? <div className="text-xs" style={{ color: C.inkSoft }}>{i.note}</div> : null}</td>
                <td className="px-4 py-3 text-right font-bold" style={{ color: i.signed < 0 ? C.debit : C.credit, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>{i.signed < 0 ? "−" : "+"}{fmtMoney(Math.abs(i.signed))}</td>
                <td className="px-4 py-3" style={{ whiteSpace: "nowrap" }}>{i.cleared ? <span className="text-xs font-semibold" style={{ color: C.credit }}>✓ Reconciled</span> : <span className="flex items-center gap-3"><span className="text-xs" style={{ color: C.inkSoft }}>Uncleared</span>{i.voidable && (role === "owner" || role === "treasurer") && <button onClick={() => voidItem(i)} className="text-xs font-semibold" style={{ color: C.debit }}>Void</button>}</span>}</td>
              </tr>
            ))}</tbody>
          </table></div>
        )}
      </Card>
      {model.recs.length > 0 && (
        <Card>
          <p className="font-black mb-3" style={{ color: C.ink }}>Past Reconciliations</p>
          <div className="grid gap-1">{model.recs.map((r) => (
            <div key={r.id} className="flex items-center justify-between text-sm py-1" style={{ borderBottom: `1px solid ${C.lineSoft}` }}>
              <span style={{ color: C.ink }}>Statement ending <b>{r.statementDate}</b></span>
              <span style={{ color: C.inkSoft }}>{fmtMoney(r.endingBalance)} · {r.clearedCount} item{r.clearedCount === 1 ? "" : "s"} · {r.createdBy}</span>
            </div>
          ))}</div>
        </Card>
      )}
      {!model.recs.length && <button onClick={() => setEditingStart(true)} className="text-xs font-semibold justify-self-start" style={{ color: C.inkSoft }}>Change Starting Point</button>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
